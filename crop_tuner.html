:root{--bk:#000;--wh:#fff;--acc:#00ff66;--mono:'Courier New',monospace}

button.sel{background:var(--acc);border-color:var(--bk)}
input[type=number]{width:64px;font-family:var(--mono);font-size:12px;border:2px solid var(--bk);padding:2px 4px}
.readout{border:2px solid var(--bk);background:var(--bk);color:var(--acc);padding:10px;font-size:12px;line-height:1.7;white-space:pre}
.zooms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zoom{border:2px solid var(--bk)}
.zoom canvas{display:block;width:100%}
.zoom .lbl{font-size:10px;padding:1px 4px;border-top:2px solid var(--bk);background:#eee}
textarea{width:100%;height:90px;font-family:var(--mono);font-size:10px;border:2px solid var(--bk);padding:4px}
.hint{font-size:10px;color:#555;line-height:1.5}

const AUTO = {"portrait": {"x": 0, "y": 160, "w": 648, "h": 1113}, "landscape": {"x": 0, "y": 458, "w": 648, "h": 358}};
const SW = 648, SH = 1440, SCALE = 0.42;
let fam = 'portrait';
let crops = JSON.parse(localStorage.getItem('soraFamCrops') || 'null') ||
            JSON.parse(JSON.stringify(AUTO));
let curSample = {portrait: 0, landscape: 0};
let selEdge = 't';
let imgs = {portrait: [], landscape: []};

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = SW * SCALE; cv.height = SH * SCALE;

function edgeVal(c, e) { return e==='t'?c.y : e==='b'?c.y+c.h : e==='l'?c.x : c.x+c.w; }
function setEdge(c, e, v) {
  v = Math.round(v);
  if (e==='t'){ const b=c.y+c.h; c.y=Math.max(0,Math.min(v,b-50)); c.h=b-c.y; }
  if (e==='b'){ c.h=Math.max(50,Math.min(v,SH)-c.y); }
  if (e==='l'){ const r=c.x+c.w; c.x=Math.max(0,Math.min(v,r-50)); c.w=r-c.x; }
  if (e==='r'){ c.w=Math.max(50,Math.min(v,SW)-c.x); }
}

function img() { return imgs[fam][curSample[fam]]; }

function draw() {
  const c = crops[fam], im = img();
  ctx.clearRect(0,0,cv.width,cv.height);
  if (im && im.complete) ctx.drawImage(im, 0,0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  const x=c.x*SCALE, y=c.y*SCALE, w=c.w*SCALE, h=c.h*SCALE;
  ctx.fillRect(0,0,cv.width,y);
  ctx.fillRect(0,y+h,cv.width,cv.height-y-h);
  ctx.fillRect(0,y,x,h);
  ctx.fillRect(x+w,y,cv.width-x-w,h);
  ctx.strokeStyle = '#fff'; ctx.setLineDash([6,4]); ctx.lineWidth = 2;
  ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);
  // selected edge highlight
  ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 3;
  ctx.beginPath();
  if (selEdge==='t'){ctx.moveTo(x,y);ctx.lineTo(x+w,y);}
  if (selEdge==='b'){ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);}
  if (selEdge==='l'){ctx.moveTo(x,y);ctx.lineTo(x,y+h);}
  if (selEdge==='r'){ctx.moveTo(x+w,y);ctx.lineTo(x+w,y+h);}
  ctx.stroke();
  drawZooms(); updateReadout(); updateEdges();
}

function drawZooms() {
  const c = crops[fam], im = img();
  if (!im || !im.complete) return;
  const zdefs = {
    zT: {sx: c.x + c.w/2 - 150/4, sy: c.y - 10, sw: 300/4, sh: 20},
    zB: {sx: c.x + c.w/2 - 150/4, sy: c.y + c.h - 10, sw: 300/4, sh: 20},
    zL: {sx: c.x - 10, sy: c.y + c.h/2 - 40/4, sw: 20, sh: 300/4},
    zR: {sx: c.x + c.w - 10, sy: c.y + c.h/2 - 40/4, sw: 20, sh: 300/4},
  };
  for (const [id, z] of Object.entries(zdefs)) {
    const zc = document.getElementById(id), zx = zc.getContext('2d');
    zx.imageSmoothingEnabled = false;
    zx.fillStyle='#333'; zx.fillRect(0,0,zc.width,zc.height);
    // scale factor from source jpg (natural size) vs screen coords
    const kx = im.naturalWidth / SW, ky = im.naturalHeight / SH;
    if (id==='zT'||id==='zB') {
      zx.drawImage(im, z.sx*kx, z.sy*ky, z.sw*kx, z.sh*ky, 0,0, zc.width, zc.height);
      zx.strokeStyle='#00ff66'; zx.lineWidth=2;
      zx.beginPath(); zx.moveTo(0, zc.height/2); zx.lineTo(zc.width, zc.height/2); zx.stroke();
    } else {
      zx.drawImage(im, z.sx*kx, z.sy*ky, z.sw*kx, z.sh*ky, 0,0, zc.width, zc.height);
      zx.strokeStyle='#00ff66'; zx.lineWidth=2;
      zx.beginPath(); zx.moveTo(zc.width/2, 0); zx.lineTo(zc.width/2, zc.height); zx.stroke();
    }
  }
}

function updateReadout() {
  const c = crops[fam];
  document.getElementById('readout').textContent =
`FAMILY   ${fam.toUpperCase()}   sample ${curSample[fam]+1}/${imgs[fam].length}  ${SAMPLES[fam][curSample[fam]].id}
CROP     w:h:x:y = ${c.w}:${c.h}:${c.x}:${c.y}
EDGES    T=${c.y}  B=${c.y+c.h}  L=${c.x}  R=${c.x+c.w}
ASPECT   ${(c.w/c.h).toFixed(4)}
FFMPEG   -vf "crop=${c.w}:${c.h}:${c.x}:${c.y}"`;
  localStorage.setItem('soraFamCrops', JSON.stringify(crops));
}

function updateEdges() {
  const c = crops[fam];
  const eb = document.getElementById('edges');
  const mk = (e, label) => {
    const v = edgeVal(c, e);
    return `<div class="row"><b class="${selEdge===e?'sel':''}">${label} = ${v}</b>` +
      [-25,-5,-1,1,5,25].map(d =>
        `<button onclick="nudge('${e}',${d})">${d>0?'+':''}${d}</button>`).join('') +
      ` <button class="${selEdge===e?'sel':''}" onclick="selEdge='${e}';draw()">sel</button></div>`;
  };
  eb.innerHTML = '<b>EDGES</b>' + mk('t','TOP') + mk('b','BOTTOM') + mk('l','LEFT') + mk('r','RIGHT');
}

function nudge(e, d) { setEdge(crops[fam], e, edgeVal(crops[fam], e) + d); selEdge = e; draw(); }

function setFam(f) {
  fam = f;
  document.getElementById('tabP').classList.toggle('on', f==='portrait');
  document.getElementById('tabL').classList.toggle('on', f==='landscape');
  buildSamples(); draw();
}

function buildSamples() {
  const s = document.getElementById('samples');
  s.innerHTML = '';
  SAMPLES[fam].forEach((sm, i) => {
    const el = document.createElement('img');
    el.src = sm.src; el.title = sm.id;
    el.className = i===curSample[fam] ? 'on' : '';
    el.onclick = () => { curSample[fam] = i; buildSamples(); draw(); };
    s.appendChild(el);
  });
}

function preset(p) {
  const c = crops[fam];
  if (p==='auto') Object.assign(c, AUTO[fam]);
  if (p==='old82') Object.assign(c, {x:0,y:160,w:648,h:1113});
  if (p==='full') Object.assign(c, {x:0,y:0,w:SW,h:SH});
  if (p==='canon916') Object.assign(c, {x:0,y:Math.round((SH-1152)/2/2)*2,w:648,h:1152});
  draw();
}

function doExport() {
  const even = v => Math.round(v/2)*2;
  const out = {};
  for (const f of ['portrait','landscape']) {
    const c = crops[f];
    out[f] = {w:even(c.w), h:even(c.h), x:even(c.x), y:even(c.y),
              ffmpeg:`crop=${even(c.w)}:${even(c.h)}:${even(c.x)}:${even(c.y)}`};
  }
  document.getElementById('exp').value = JSON.stringify(out, null, 1);
}
function copyExport() { doExport();
  navigator.clipboard && navigator.clipboard.writeText(document.getElementById('exp').value); }

// drag + keys
let dragging = null;
const wrap = document.getElementById('wrap');
wrap.addEventListener('mousedown', ev => {
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX - r.left)/SCALE, my = (ev.clientY - r.top)/SCALE;
  const c = crops[fam];
  const near = [['t',Math.abs(my-c.y)],['b',Math.abs(my-(c.y+c.h))],
                ['l',Math.abs(mx-c.x)],['r',Math.abs(mx-(c.x+c.w))]];
  near.sort((a,b)=>a[1]-b[1]);
  if (near[0][1] < 30) { dragging = near[0][0]; selEdge = dragging; draw(); }
});
window.addEventListener('mousemove', ev => {
  if (!dragging) return;
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX - r.left)/SCALE, my = (ev.clientY - r.top)/SCALE;
  setEdge(crops[fam], dragging, (dragging==='t'||dragging==='b') ? my : mx);
  draw();
});
window.addEventListener('mouseup', () => dragging = null);
window.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if ('tblr'.includes(k) && k.length===1) { selEdge = k; draw(); return; }
  let d = ev.altKey ? 25 : ev.shiftKey ? 5 : 1;
  if (ev.key==='ArrowUp'   && (selEdge==='t'||selEdge==='b')) nudge(selEdge,-d);
  else if (ev.key==='ArrowDown' && (selEdge==='t'||selEdge==='b')) nudge(selEdge, d);
  else if (ev.key==='ArrowLeft' && (selEdge==='l'||selEdge==='r')) nudge(selEdge,-d);
  else if (ev.key==='ArrowRight'&& (selEdge==='l'||selEdge==='r')) nudge(selEdge, d);
  else return;
  ev.preventDefault();
});

// init
document.getElementById('cntP').textContent = `(${SAMPLES.portrait.length})`;
document.getElementById('cntL').textContent = `(${SAMPLES.landscape.length})`;
for (const f of ['portrait','landscape']) {
  SAMPLES[f].forEach(sm => {
    const im = new Image();
    im.onload = () => draw();
    im.src = sm.src;
    imgs[f].push(im);
  });
}
buildSamples(); draw();
</script></body></html>
