<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SORA_LATENT_LOOM | OPERATIONAL PRAGMATIST</title>
    <style>
        /* --- CALIBRATION: STRICT B&W BINARY --- */
        :root {
            --bg-base: #FFFFFF;
            --text-main: #000000;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Eradicate softness */
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: none; /* Emphasize raw pixel execution */
            overscroll-behavior: none;
        }

        button, input {
            font-family: inherit;
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--text-main);
            outline: none;
            cursor: pointer;
            font-weight: 900;
            transition: none; /* No occult fading */
        }
        button:hover {
            background: var(--text-main);
            color: var(--bg-base);
        }

        /* Brutalist Scrollbars */
        ::-webkit-scrollbar { width: 12px; border-left: 1px solid var(--text-main); }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--text-main); border: 2px solid var(--bg-base); }

        /* --- CONTINUOUS TOPOLOGY (NO PAGINATION) --- */
        #canvas {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 50vh; /* Hardware floor clearance */
            display: flex;
            flex-direction: column;
            scroll-behavior: auto;
        }

        .section-header {
            font-weight: 900;
            font-size: 14px;
            padding: 12px 16px;
            border-bottom: 4px solid var(--text-main);
            background: var(--bg-base);
            position: sticky;
            top: 0;
            z-index: 20;
            text-transform: uppercase;
        }

        /* Z-1: MAP MATRIX */
        #view-map {
            height: 50vh;
            border-bottom: 1px solid var(--text-main);
            position: relative;
            background: repeating-linear-gradient(0deg, transparent, transparent 39px, #000 40px),
                        repeating-linear-gradient(90deg, transparent, transparent 39px, #000 40px);
            background-size: 40px 40px;
        }
        .map-node {
            position: absolute;
            transform: translate(-50%, -50%);
            border: 1px solid var(--text-main);
            background: var(--bg-base);
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-node:hover {
            z-index: 10;
            border-width: 3px;
            transform: translate(-50%, -50%) scale(2);
        }
        .map-node.dust { width: 4px; height: 4px; background: var(--text-main); border: none; }
        .map-node.cluster { width: 14px; height: 14px; }

        /* GEOMETRIC BOOLEANS (Replacing Semantic Colors) */
        .pip-trains { background: var(--text-main); }
        .pip-bees { background: var(--bg-base); border: 2px solid var(--text-main); }
        .pip-ripple { background: repeating-linear-gradient(45deg, var(--text-main), var(--text-main) 2px, var(--bg-base) 2px, var(--bg-base) 4px); }

        /* Z-2: KINEMATIC FEED */
        #view-feed {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            border-bottom: 1px solid var(--text-main);
        }
        .clip-card {
            border: 1px solid var(--text-main);
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
        }
        .clip-header {
            padding: 8px;
            border-bottom: 1px solid var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            font-size: 11px;
            cursor: crosshair;
        }
        .transclusion-pips { display: flex; gap: 4px; }
        .pip { width: 12px; height: 12px; border: 1px solid var(--text-main); }
        
        .strip-container {
            display: flex;
            height: 60px;
            border-bottom: 1px solid var(--text-main);
            cursor: ew-resize;
        }
        .frame {
            flex: 1;
            border-right: 1px solid var(--text-main);
            background: var(--bg-base);
        }
        .frame:last-child { border-right: none; }
        .frame.active-scrub { background: var(--text-main); }

        .clip-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .prompt-text { font-size: 11px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; font-weight: 600; }
        .clip-actions { display: flex; gap: 8px; }
        .btn-action { flex: 1; padding: 6px; font-size: 10px; }
        .btn-diff.selected { background: var(--text-main); color: var(--bg-base); }

        /* Z-3: DIFF ENGINE */
        #view-diff {
            padding: 16px;
            min-height: 40vh;
        }
        .diff-layout { display: flex; gap: 16px; }
        @media (max-width: 768px) { .diff-layout { flex-direction: column; } }

        .diff-pane {
            flex: 1;
            border: 4px solid var(--text-main);
            display: flex;
            flex-direction: column;
        }
        .diff-vid-header { background: var(--text-main); color: var(--bg-base); padding: 4px 8px; font-weight: 900; font-size: 11px; }
        .diff-code {
            padding: 16px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-weight: 600;
        }
        
        /* Structural Typography for Differences */
        ins { border-bottom: 3px solid var(--text-main); font-weight: 900; background: transparent; color: var(--text-main); text-decoration: none; padding: 0 2px; }
        del { background: var(--text-main); color: var(--bg-base); text-decoration: line-through; font-weight: 900; padding: 0 4px; }

        /* --- TRAY: PERSPECTIVE ANCHORED AT HARDWARE FLOOR --- */
        #tray {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 40vh;
            min-height: 60px;
            background: var(--bg-base);
            border-top: 4px solid var(--text-main);
            display: flex;
            flex-direction: column;
            z-index: 50;
        }
        .tray-handle {
            height: 24px;
            border-bottom: 1px solid var(--text-main);
            background: repeating-linear-gradient(90deg, transparent, transparent 2px, var(--text-main) 2px, var(--text-main) 4px);
            cursor: ns-resize;
        }
        .tray-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--text-main);
        }
        .tray-title { font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .tray-title input { border: none; border-bottom: 2px solid var(--text-main); width: 160px; font-size: 14px; padding-bottom: 2px; }
        
        /* Flex column-reverse injects new items visually at the bottom, pushing older data upward */
        #manifest-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
        }
        
        .manifest-clip {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--text-main);
            padding: 6px 12px;
            background: var(--bg-base);
            cursor: crosshair;
            flex-shrink: 0;
        }
        .manifest-clip-id { font-weight: 900; font-size: 12px; flex: 1; pointer-events: none; }
        
        .tier-input {
            width: 100%;
            border: none;
            border-bottom: 4px solid var(--text-main);
            font-size: 14px;
            font-weight: 900;
            padding: 12px 0 4px 0;
            margin-top: 16px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* --- TERMINAL: FLATTENED DEPTH & PHYSICAL GRADIENT --- */
        #terminal {
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, var(--bg-base) 0%, var(--bg-base) 85%, rgba(255,255,255,0) 100%);
            z-index: 100;
            display: none;
            flex-direction: column-reverse; /* Output anchored base-first */
            padding: 24px;
            pointer-events: auto;
        }
        #terminal.active { display: flex; }
        #term-output {
            display: flex;
            flex-direction: column-reverse; /* Output stack injects at hardware floor */
            overflow-y: auto;
            max-height: 80vh;
        }
        .term-line { font-weight: 900; font-size: 12px; margin-bottom: 4px; }
        .term-line.cmd { text-decoration: underline; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="canvas">
        <div class="section-header">Z-1: LATENT TOPOLOGY (MAP)</div>
        <div id="view-map"></div>

        <div class="section-header">Z-2: KINEMATIC PAYLOADS (FEED)</div>
        <div id="view-feed"></div>

        <div class="section-header" id="diff-anchor">Z-3: MORPHOLOGICAL DIFF ENGINE</div>
        <div id="view-diff">
            <div class="diff-layout" id="diff-container">
                <div style="font-weight:900; padding:24px; border:1px solid #000;">
                    [ AWAITING INPUT VECTOR ]<br>
                    > Select exactly two clips from Z-2 using "[ DIFF ]".<br>
                    > The meaning of the syntax is its differential output.
                </div>
            </div>
        </div>
    </div>

    <div id="tray">
        <div class="tray-handle" id="tray-handle"></div>
        <div class="tray-header">
            <div class="tray-title">
                MANIFEST: <input type="text" value="BEES_ON_A_TRAIN" id="project-name">
            </div>
            <div>
                <button class="btn-action" onclick="addTier()">+ INJECT TIER</button>
                <button class="btn-action" style="background:var(--text-main); color:var(--bg-base);" onclick="runPipeline()">$ COMPILE</button>
            </div>
        </div>
        <div id="manifest-content"></div>
    </div>

    <div id="terminal" onclick="this.classList.remove('active')">
        <div id="term-output"></div>
    </div>

    <script>
        // --- 1. DATA: REAL PAYLOADS ---
        const CLUSTERS = {
            'TRAINS_TROLLEYS': { pat: 'pip-trains', label: 'TRAINS', x: 15, y: 25 },
            'BEES_ON_A_TRAIN': { pat: 'pip-bees', label: 'BEES', x: 20, y: 55 },
            'RIPPLE_SESSIONS': { pat: 'pip-ripple', label: 'RIPPLE', x: 75, y: 35 },
            'VALHALLA_VIKINGS': { pat: 'pip-trains', label: 'VIKINGS', x: 85, y: 20 },
            'TROUT_TOWN': { pat: 'pip-bees', label: 'TROUT', x: 40, y: 20 },
            'POISONED_WELL': { pat: 'pip-ripple', label: 'POISON', x: 60, y: 65 },
            'CRAB_REEF': { pat: 'pip-trains', label: 'CRAB', x: 30, y: 75 },
            'AZMARI_MATRIARCH': { pat: 'pip-bees', label: 'AZMARI', x: 55, y: 45 },
            'LINEAGE_GENOME': { pat: 'pip-ripple', label: 'GENOME', x: 70, y: 55 },
            'SPECULATIVE_FORECAST': { pat: 'pip-trains', label: 'FORECAST', x: 45, y: 80 },
            'UNCLASSIFIED': { pat: '', label: '', x: 50, y: 50 }
        };

        const DB = [];

        // Bootstrap from real SORA_CAPTURES data
        async function bootstrapLoom() {
            try {
                const resp = await fetch('sora_full_index.json');
                if (!resp.ok) return;
                const index = await resp.json();
                DB.length = 0;

                for (const entry of index.clips) {
                    const cluster = CLUSTERS[entry.cluster] ? entry.cluster : 'UNCLASSIFIED';
                    const base = CLUSTERS[cluster] || CLUSTERS['UNCLASSIFIED'];
                    DB.push({
                        id: entry.id,
                        cluster: cluster,
                        tags: (entry.clusters || []).filter(c => c !== cluster),
                        x: base.x + (Math.random() * 12 - 6),
                        y: base.y + (Math.random() * 12 - 6),
                        prompt: entry.prompt || '',
                        video: entry.video ? `captures/${entry.video}` : null
                    });
                }

                renderMap();
                renderFeed();
                renderManifest();
            } catch(e) { console.log('Index not available:', e); }
        }

        // Array is inverted due to column-reverse. Index 0 is visually at the bottom floor.
        let manifestState = [
            { type: 'clip', id: '008_20260422', uid: 1 },
            { type: 'tier', text: '# TIER_1_ESTABLISHMENT', uid: 2 }
        ];
        let diffQueue = [];
        let uidCounter = 3;

        // --- 2. RENDERERS ---
        function renderMap() {
            const map = document.getElementById('view-map');
            let html = '';
            
            Object.keys(CLUSTERS).forEach(key => {
                if(key === 'UNCLASSIFIED') return;
                html += `<div style="position:absolute; left:${CLUSTERS[key].x}%; top:${CLUSTERS[key].y - 5}%; transform:translate(-50%, -50%); font-weight:900; font-size:10px; background:#fff; border:1px solid #000; padding:2px 4px;">${key}</div>`;
            });

            DB.forEach(clip => {
                const isDust = clip.cluster === 'UNCLASSIFIED';
                const cls = isDust ? 'map-node dust' : `map-node cluster ${CLUSTERS[clip.cluster].pat}`;
                html += `<div class="${cls}" style="left:${clip.x}%; top:${clip.y}%;" title="${clip.id}"></div>`;
            });
            map.innerHTML = html;

            map.addEventListener('click', (e) => {
                if(e.target.classList.contains('map-node')) {
                    const title = e.target.getAttribute('title');
                    if (title && !title.startsWith('unk_')) {
                        const card = document.getElementById(`card-${title}`);
                        if (card) {
                            card.style.border = '4px solid #000';
                            card.scrollIntoView({ behavior: 'instant', block: 'center' });
                            setTimeout(() => { card.style.border = '1px solid #000'; }, 1000);
                        }
                    }
                }
            });
        }

        function getStripHTML() {
            return '<div class="frame"></div>'.repeat(5);
        }

        function renderFeed() {
            const feed = document.getElementById('view-feed');
            let html = '';
            
            DB.filter(c => c.cluster !== 'UNCLASSIFIED').forEach(clip => {
                const isDiff = diffQueue.includes(clip.id) ? 'selected' : '';
                let pips = `<div class="pip ${CLUSTERS[clip.cluster].pat}"></div>`;
                clip.tags.forEach(t => { if(CLUSTERS[t]) pips += `<div class="pip ${CLUSTERS[t].pat}"></div>`; });

                html += `
                    <div class="clip-card" id="card-${clip.id}" data-id="${clip.id}">
                        <div class="clip-header">
                            <span>${clip.id}</span>
                            <div class="transclusion-pips">${pips}</div>
                        </div>
                        <div class="strip-container" onmousemove="scrub(event, this)" onmouseleave="resetScrub(this)">
                            ${getStripHTML()}
                        </div>
                        <div class="clip-body">
                            <div class="prompt-text">${clip.prompt}</div>
                            <div class="clip-actions">
                                <button class="btn-action route-btn" data-id="${clip.id}">+ ROUTE</button>
                                <button class="btn-action btn-diff ${isDiff}" onclick="toggleDiff('${clip.id}', event)">[ DIFF ]</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            feed.innerHTML = html;
            bindActuators();
        }

        function renderManifest() {
            const content = document.getElementById('manifest-content');
            let html = '';
            
            manifestState.forEach((item) => {
                if(item.type === 'tier') {
                    html += `<input type="text" class="tier-input" value="${item.text}" onchange="updateTier(${item.uid}, this.value)">`;
                } else {
                    html += `
                        <div class="manifest-clip" data-id="${item.id}" id="man-${item.uid}">
                            <div class="manifest-clip-id">[[clip:${item.id}]]</div>
                            <button class="btn-action" style="flex:0; padding:4px 8px; border:none;" onclick="removeManifestItem(${item.uid}, event)">X</button>
                        </div>
                    `;
                }
            });
            content.innerHTML = html;
            bindActuators();
        }

        // --- 3. EPISTEMIC MACHINERY: BIDIRECTIONAL BINDING ---
        // Inner text translates outer space; Outer visual intersects inner text state.
        function bindActuators() {
            const cards = document.querySelectorAll('.clip-card');
            const items = document.querySelectorAll('.manifest-clip');

            const resetStates = () => {
                cards.forEach(c => c.style.border = '1px solid #000');
                items.forEach(i => { i.style.background = '#FFF'; i.style.color = '#000'; });
            };

            // First-Order: Text operates payload
            items.forEach(item => {
                item.onmousedown = (e) => {
                    if(e.target.closest('button')) return;
                    resetStates();
                    item.style.background = '#000';
                    item.style.color = '#FFF';
                    
                    const id = item.getAttribute('data-id');
                    const card = document.getElementById(`card-${id}`);
                    if(card) {
                        card.style.border = '4px solid #000';
                        card.scrollIntoView({ behavior: 'instant', block: 'center' });
                    }
                };
            });

            // Second-Order: Payload operates text
            cards.forEach(card => {
                const header = card.querySelector('.clip-header');
                header.onmousedown = (e) => {
                    resetStates();
                    card.style.border = '4px solid #000';
                    
                    const id = card.getAttribute('data-id');
                    let found = false;
                    items.forEach(item => {
                        if(item.getAttribute('data-id') === id) {
                            item.style.background = '#000';
                            item.style.color = '#FFF';
                            item.scrollIntoView({ behavior: 'instant', block: 'end' });
                            found = true;
                        }
                    });
                    if (found) {
                        const tray = document.getElementById('tray');
                        if (tray.offsetHeight < window.innerHeight * 0.2) tray.style.height = '40vh';
                    }
                };
            });
            
            // Route actuates push to hardware floor
            document.querySelectorAll('.route-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = e.target.getAttribute('data-id');
                    manifestState.unshift({ type: 'clip', id: id, uid: uidCounter++ });
                    renderManifest();
                    document.getElementById('manifest-content').scrollTop = 0;
                };
            });
        }

        // --- 4. TACTILE OPERATIONS ---
        window.scrub = function(e, container) {
            const rect = container.getBoundingClientRect();
            const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width - 1));
            const activeIndex = Math.floor((x / rect.width) * 5);
            container.querySelectorAll('.frame').forEach((f, i) => {
                if(i === activeIndex) f.classList.add('active-scrub');
                else f.classList.remove('active-scrub');
            });
        }
        window.resetScrub = function(container) {
            container.querySelectorAll('.frame').forEach(f => f.classList.remove('active-scrub'));
        }

        window.addTier = function() {
            manifestState.unshift({ type: 'tier', text: '# NEW_TIER_SEQUENCE', uid: uidCounter++ });
            renderManifest();
            document.getElementById('manifest-content').scrollTop = 0;
        }

        window.removeManifestItem = function(uid, e) {
            e.stopPropagation();
            manifestState = manifestState.filter(m => m.uid !== uid);
            renderManifest();
        }
        window.updateTier = function(uid, val) {
            const item = manifestState.find(m => m.uid === uid);
            if(item) item.text = val;
        }

        // --- 5. MORPHOLOGICAL DIFF ENGINE ---
        window.toggleDiff = function(id, e) {
            e.stopPropagation();
            if(diffQueue.includes(id)) diffQueue = diffQueue.filter(x => x !== id);
            else {
                if(diffQueue.length >= 2) diffQueue.shift();
                diffQueue.push(id);
            }
            renderFeed();
            if(diffQueue.length === 2) {
                executeDiff();
                document.getElementById('diff-anchor').scrollIntoView({ behavior: 'instant', block: 'start' });
            } else {
                document.getElementById('diff-container').innerHTML = `
                    <div style="font-weight:900; padding:24px; border:1px solid #000;">
                        [ AWAITING INPUT VECTOR ]<br>> Select exactly two clips from Z-2.
                    </div>`;
            }
        }

        function executeDiff() {
            const container = document.getElementById('diff-container');
            const c1 = DB.find(c => c.id === diffQueue[0]);
            const c2 = DB.find(c => c.id === diffQueue[1]);
            
            const wordsA = c1.prompt.split(/([\s\n]+)/);
            const wordsB = c2.prompt.split(/([\s\n]+)/);
            let htmlA = '', htmlB = '';
            
            wordsA.forEach(w => {
                if(w.trim()==='') htmlA += w;
                else if(!wordsB.includes(w)) htmlA += `<del>${w}</del>`;
                else htmlA += w;
            });
            wordsB.forEach(w => {
                if(w.trim()==='') htmlB += w;
                else if(!wordsA.includes(w)) htmlB += `<ins>${w}</ins>`;
                else htmlB += w;
            });

            container.innerHTML = `
                <div class="diff-pane">
                    <div class="diff-vid-header">VECTOR A: ${c1.id}</div>
                    <div class="diff-code">${htmlA}</div>
                </div>
                <div class="diff-pane">
                    <div class="diff-vid-header">VECTOR B: ${c2.id}</div>
                    <div class="diff-code">${htmlB}</div>
                </div>
            `;
        }

        // --- 6. PERSPECTIVE-ANCHORED PHYSICS ---
        const tray = document.getElementById('tray');
        const handle = document.getElementById('tray-handle');
        let isDragging = false;
        
        handle.onmousedown = (e) => { isDragging = true; document.body.style.userSelect = 'none'; };
        window.onmousemove = (e) => {
            if(!isDragging) return;
            // Calculate delta explicitly from the ground plane
            const y = window.innerHeight - e.clientY;
            tray.style.height = `${Math.max(60, Math.min(y, window.innerHeight * 0.85))}px`;
        };
        window.onmouseup = () => { isDragging = false; document.body.style.userSelect = ''; };

        handle.addEventListener('touchstart', (e) => { isDragging = true; }, {passive:true});
        window.addEventListener('touchmove', (e) => {
            if(!isDragging) return;
            const y = window.innerHeight - e.touches[0].clientY;
            tray.style.height = `${Math.max(60, Math.min(y, window.innerHeight * 0.85))}px`;
        }, {passive:false});
        window.addEventListener('touchend', () => { isDragging = false; });

        // --- 7. TERMINAL COMPILATION OVERLAY ---
        async function runPipeline() {
            const term = document.getElementById('terminal');
            const out = document.getElementById('term-output');
            const projName = document.getElementById('project-name').value;
            
            term.classList.add('active');
            out.innerHTML = '';
            
            const clips = manifestState.filter(m => m.type === 'clip').length;

            const logs = [
                `$ ./extract_frames.sh --manifest ${projName}.txt`,
                `> PARSING LAYOUT GRAPH...`,
                `> FOUND ${clips} NODES ROUTED TO SEQUENCE.`,
                `> EXTRACTING TEMPORAL SLICES...`,
                `> COMPOSITING HORIZONTAL STRIPS [HSTACK]...`,
                `> ASSEMBLING CONTACT SHEET [VSTACK]...`,
                `[✓] OUTPUT WRITTEN TO /SORA_CONTACT_SHEETS/${projName}/`
            ];

            for(let i=0; i<logs.length; i++) {
                const div = document.createElement('div');
                div.className = 'term-line' + (i===0?' cmd':'');
                div.innerHTML = logs[i];
                // Using column-reverse so insert at beginning of DOM maps to hardware floor
                out.insertAdjacentHTML('afterbegin', div.outerHTML);
                await new Promise(r => setTimeout(r, 200));
            }
            const div = document.createElement('div');
            div.className = 'term-line';
            div.innerHTML = '> TERMINAL HALTED. CLICK OUTSIDE TO CLOSE.';
            div.style.marginTop = '16px';
            out.insertAdjacentHTML('afterbegin', div.outerHTML);
        }

        renderMap();
        renderFeed();
        renderManifest();
        bootstrapLoom();
    </script>
