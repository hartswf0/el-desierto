/* EL DESIERTO compatibility shim: route this lab piece at the repo's real media.
   Any clip-id mp4/jpg -> ../PREVIEWS | ../POSTERS; SORA_CAPTURES/ paths -> ../ */
(function(){
  var ROOT='../';
  var CID=/(\d{1,4}_\d{8}_\d{6})/;
  function remap(u){
    if(typeof u!=='string')return u;
    if(u.indexOf('data:')===0||u.indexOf('blob:')===0)return u;
    var m=u.match(CID);
    if(m&&/\.mp4/.test(u))return ROOT+'PREVIEWS/'+m[1]+'.mp4';
    if(m&&/\.(jpg|jpeg|png)/.test(u))return ROOT+'POSTERS/'+m[1]+'.jpg';
    u=u.replace(/^.*SORA_CAPTURES\//,ROOT);
    if(/^manifest\.json/.test(u))return ROOT+'manifest.json';
    return u;
  }
  var of=window.fetch;
  if(of)window.fetch=function(u,o){return of.call(this,remap(u&&u.url?u.url:u),o);};
  function hook(proto){
    var d=Object.getOwnPropertyDescriptor(proto,'src');
    if(!d||!d.set)return;
    Object.defineProperty(proto,'src',{
      get:function(){return d.get.call(this);},
      set:function(v){d.set.call(this,remap(v));}
    });
  }
  try{hook(HTMLMediaElement.prototype);}catch(e){}
  try{hook(HTMLImageElement.prototype);}catch(e){}
  try{hook(HTMLSourceElement.prototype);}catch(e){}
  var osa=Element.prototype.setAttribute;
  Element.prototype.setAttribute=function(k,v){
    if(k==='src'&&typeof v==='string')v=remap(v);
    return osa.call(this,k,v);
  };
})();
</script>

function clickSound(kind){if(!soundOn){return}var ctx=ensureAudio();if(!ctx){return}var t=ctx.currentTime;var gain=ctx.createGain();gain.connect(ctx.destination);gain.gain.setValueAtTime(0.0001,t);gain.gain.exponentialRampToValueAtTime(kind==="hit"?0.055:0.025,t+0.006);gain.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="film"?0.035:0.055));var osc=ctx.createOscillator();osc.type=kind==="hit"?"square":"triangle";osc.frequency.setValueAtTime(kind==="hit"?620:160,t);osc.frequency.exponentialRampToValueAtTime(kind==="hit"?180:90,t+0.04);osc.connect(gain);osc.start(t);osc.stop(t+0.06)}
function parseText(data){if(data.output_text){return data.output_text}if(data.output&&data.output.length){var out="";for(var i=0;i<data.output.length;i++){var c=data.output[i].content||[];for(var j=0;j<c.length;j++){out+=c[j].text||""}}return out}return ""}
function run(){var s=settings();var a=agent();var text=el("moveText").value;el("moveText").value="";clickSound("train");if(!s.apiKey||!s.endpoint){setApi("off","API OFF. Add a key to print thought tickets.");renderStatic();return}el("runBtn").disabled=true;el("runBtn").textContent="...";el("app").className="loadingGate";var labels=[];for(var i=0;i<items.length;i++){labels.push(items[i].label)}var model=s.model||"gpt-4.1-mini";var active=currentItem()?currentItem().label:"none";setApi("calling","CALLING "+model+" for "+a.name+". Printing one ticket.");var prompt="Return ONLY valid JSON shaped exactly as {\"sees\":[\"LABEL\",\"LABEL\",\"LABEL\"],\"thing\":\"LABEL\",\"thought\":\"one short stream-of-consciousness fragment, concrete and ordinary\"}. No prose. No markdown. sees must be 3 to 6 exact labels from: "+labels.join(", ")+". thing must be one exact label from sees. Passenger: "+JSON.stringify({id:a.id,name:a.name,role:a.role,current_sees:a.sees})+". Current passing item: "+active+". Whisper: "+text;fetch(s.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.apiKey},body:JSON.stringify({model:model,input:prompt,max_output_tokens:220})}).then(function(r){return r.json().then(function(d){if(!r.ok){var m=(d.error&&d.error.message)?d.error.message:"HTTP "+r.status;throw new Error(m)}return d})}).then(function(d){var raw=parseText(d);var x=raw.indexOf("{");var y=raw.lastIndexOf("}");if(x<0||y<x){throw new Error("bad json") }var j=JSON.parse(raw.slice(x,y+1));var allowed={};for(var i=0;i<labels.length;i++){allowed[labels[i]]=true}var next=[];if(j.sees&&j.sees.length){for(var k=0;k<j.sees.length;k++){if(allowed[j.sees[k]]&&next.indexOf(j.sees[k])<0){next.push(j.sees[k])}}}if(!next.length){throw new Error("no valid labels")}state.sees=next.slice(0,6);var thing=allowed[j.thing]?j.thing:state.sees[0];var thought=String(j.thought||"").slice(0,180)||"No thought returned.";pushTicket(a.id,thing,thought);setApi("ok","OK. Printed "+a.name+" ticket from: "+thing);save();renderStatic()}).catch(function(e){setApi("fail","LLM FAILED: "+e.message+". No ticket printed.");renderStatic()}).finally(function(){el("runBtn").disabled=false;el("runBtn").textContent="RUN";el("app").className=""})}
function runSelfTests(){console.assert(el("fieldWords"),"fieldWords element exists");console.assert(items.length===24,"24 shared field items exist");console.assert(agents.length===4,"4 passengers exist");console.assert(typeof posFor(items[0],0)==="number","posFor returns a number");console.assert(clean("<x>")==="&lt;x&gt;","clean escapes HTML")}
el("runBtn").onclick=run;el("resetBtn").onclick=function(){localStorage.removeItem(STORE);state=defaults();currentIndex=-1;renderStatic()};el("soundBtn").onclick=function(){soundOn=!soundOn;localStorage.setItem(SOUNDSTORE,soundOn?"1":"0");ensureAudio();clickSound("train");renderSound()};el("cycleBtn").onclick=function(){var idx=0;for(var i=0;i<agents.length;i++){if(agents[i].id===state.agent){idx=i}}select(agents[(idx+1)%agents.length].id)};el("keyBtn").onclick=function(){var s=settings();el("apiKey").value=s.apiKey||"";el("endpoint").value=s.endpoint||"https://api.openai.com/v1/responses";el("model").value=s.model||"gpt-4.1-mini";el("modal").className="modal open"};el("closeBtn").onclick=function(){el("modal").className="modal"};el("saveBtn").onclick=function(){localStorage.setItem(KEYSTORE,JSON.stringify({apiKey:el("apiKey").value.trim(),endpoint:el("endpoint").value.trim(),model:el("model").value.trim()||"gpt-4.1-mini"}));if(hasApi()){state.apiStatus="ready";state.apiMsg="API ready. Press RUN to print one thought ticket."}else{state.apiStatus="off";state.apiMsg="API OFF. No thought tickets will be generated."}save();el("modal").className="modal";renderStatic()};document.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){run()}if(e.key==="Escape"){el("modal").className="modal"}});runSelfTests();renderStatic();requestAnimationFrame(animate);
})();
