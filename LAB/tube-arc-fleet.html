                    else if (S.view === 1) {
                        S.cam = Math.max(0, cam0 - dx / S.zoom);
                        S.benchScroll = sc0 - dy;
                    }
                    else if (S.view === 2) S.atlasScroll = at0 - dy;
                    dirty();
                };
                const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
                addEventListener('pointermove', mv); addEventListener('pointerup', up);
            }

            function beginMarquee(x, y) {
                S.marquee = { x0: x, y0: y, x1: x, y1: y };
                const mv = ev => { S.marquee.x1 = ev.clientX; S.marquee.y1 = ev.clientY; dirty(); };
                const up = () => {
                    removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
                    const m = S.marquee; S.marquee = null;
                    const rx0 = Math.min(m.x0, m.x1), rx1 = Math.max(m.x0, m.x1), ry0 = Math.min(m.y0, m.y1), ry1 = Math.max(m.y0, m.y1);
                    for (const h of rendered) {
                        if (!h.u || h.u.k !== 'c') continue;
                        const r = h.rect;
                        if (r.x < rx1 && r.x + r.w > rx0 && r.y < ry1 && r.y + r.h > ry0) S.sel.add(h.u.c.id);
                    }
                    if (S.sel.size) S.lastSel = [...S.sel][S.sel.size - 1];
                    updateBatch(); S.forceList = true; listDirty(); dirty();
                    toast(S.sel.size + ' SELECTED');
                };
                addEventListener('pointermove', mv); addEventListener('pointerup', up);
            }

            stage.addEventListener('wheel', e => {
                e.preventDefault();
                if (S.view === 0) S.cam = Math.max(0, S.cam + e.deltaY * 3);
                else if (S.view === 1) {
                    if (e.ctrlKey || e.metaKey) S.zoom = clamp(S.zoom * (e.deltaY > 0 ? .9 : 1.11), .04, 4);
                    else if (e.shiftKey) S.benchScroll += e.deltaY;
                    else S.cam = Math.max(0, S.cam + e.deltaY / S.zoom * .8);
                }
                else if (S.view === 2) S.atlasScroll += e.deltaY;
                dirty();
            }, { passive: false });

            stage.addEventListener('dblclick', e => {
                const h = hitAt(e.clientX, e.clientY);
                if (h && h.u && h.u.k === 'c') { openInspector(h.u.c); selectOnly(h.u.c); }
                else if (h && h.u && h.u.k === 'g') { h.u.g.collapsed = false; rebuildIndex(); renderGroups(); dirty(); toast('EXPANDED ' + h.u.g.name); }
            });

            // =========================================================
            // UI — rail, tabs, chips, dock
            // =========================================================
            document.querySelectorAll('#rail [data-view]').forEach(b => {
                b.onclick = () => {
                    S.view = +b.dataset.view;
                    document.querySelectorAll('#rail [data-view]').forEach(x => x.classList.toggle('on', x === b));
                    dirty(); toast(['TUBE', 'BENCH', 'ATLAS', 'STATS'][S.view]);
                };
            });
            document.querySelectorAll('#rail [data-tool]').forEach(b => {
                b.onclick = () => {
                    S.tool = b.dataset.tool;
                    document.querySelectorAll('#rail [data-tool]').forEach(x => x.classList.toggle('on', x === b));
                    toast(S.tool);
                };
            });

            function setTab(name) {
                document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
                document.querySelectorAll('.pane').forEach(p => p.classList.toggle('show', p.id === 'pane-' + name));
                if (name === 'grp') renderGroups();
                if (name === 'tub') renderTubes();
                if (name === 'bin') listDirty();
            }
            document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => setTab(b.dataset.tab); });

            function toggleOps(force) {
                const show = force !== undefined ? force : ops.classList.contains('hide');
                ops.classList.toggle('hide', !show);
                binBtn.classList.toggle('on', show);
                dirty();
            }
            binBtn.onclick = () => toggleOps();

            function updateTubeChips() {
                tubeChips.innerHTML = '';
                for (const t of DOC.tubes) {
                    const b = document.createElement('button');
                    b.textContent = t.name;
                    b.classList.toggle('on', t.id === S.tube);
                    b.onclick = () => { S.tube = t.id; S.ch = Math.min(S.ch, t.chN - 1); updateTubeChips(); dirty(); toast(t.name); };
                    tubeChips.appendChild(b);
                }
            }
            function updateAggStrip() {
                const a = IX.agg;
                if (!a || !a.n) { aggStrip.innerHTML = '<i>EMPTY — LOAD MANIFEST IN I/O</i>'; return; }
                aggStrip.innerHTML =
                    '<i>' + a.n + ' CLIPS</i>' +
                    '<i>' + a.status.ok + ' OK</i>' +
                    (a.status.violation ? '<i class="vio">' + a.status.violation + ' VIO</i>' : '') +
                    (a.status.error ? '<i class="err">' + a.status.error + ' ERR</i>' : '') +
                    '<i>' + a.linked + ' MEDIA</i>' +
                    '<i>' + fmt(a.dur) + ' TOTAL</i>';
            }
            function updateIoNote() {
                const a = IX.agg;
                ioNote.innerHTML = 'MANIFEST: ' + esc(S.manifestName || 'none') + ' · MEDIA: ' + (a ? a.linked : 0) + ' linked / ' + (a ? a.n : 0) + ' clips.<br>' +
                    'Layout persists in this browser. Media links are session-only — re-run LINK MEDIA FOLDER after reload; clips re-attach by filename.';
            }

            $('playBtn').onclick = () => {
                S.play = !S.play;
                $('playBtn').classList.toggle('on', S.play);
                $('playBtn').textContent = S.play ? 'STOP' : 'PLAY';
                dirty();
            };
            $('snapBtn').onclick = () => { S.snap = !S.snap; $('snapBtn').classList.toggle('on', S.snap); toast('SNAP ' + (S.snap ? 'ON' : 'OFF')); };
            $('jumpBack').onclick = () => { S.cam = 0; dirty(); };
            $('jumpFwd').onclick = () => {
                let mx = 0;
                for (const c of DOC.clips) mx = Math.max(mx, c.start + c.dur);
                S.cam = mx; dirty();
            };
            $('fitBtn').onclick = () => {
                let mx = 1;
                for (const c of IX.byTube.get(S.tube) || DOC.clips) mx = Math.max(mx, c.start + c.dur);
                const A = area();
                S.zoom = clamp(A.w / (mx + 600), .04, 4);
                S.cam = mx / 2; dirty(); toast('FIT');
            };

            // =========================================================
            // GROUPS PANE
            // =========================================================
            function renderGroups() {
                grpStack.innerHTML = '';
                if (!DOC.groups.length) {
                    const d = document.createElement('div');
                    d.className = 'ioNote';
                    d.textContent = 'No groups yet. Multi-select clips (SEL+ tool, or marquee in BENCH), then tap GROUP in the batch bar.';
                    grpStack.appendChild(d);
                }
                for (const g of DOC.groups) {
                    const n = DOC.clips.filter(c => c.group === g.id).length;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = '<div class="hd"><div class="dot" style="background:' + g.accent + '"></div><input value="' + esc(g.name) + '" /></div>' +
                        '<small>' + n + ' CLIPS · ' + (g.collapsed ? 'COLLAPSED' : 'EXPANDED') + '</small>' +
                        '<div class="btns"><button data-a="sel">SELECT</button><button data-a="fold">' + (g.collapsed ? 'EXPAND' : 'COLLAPSE') + '</button><button data-a="color">COLOR</button><button data-a="del">DISSOLVE</button></div>';
                    card.querySelector('input').onchange = e => { g.name = e.target.value.toUpperCase().slice(0, 14) || g.name; save(); dirty(); renderGroups(); };
                    card.querySelector('[data-a="sel"]').onclick = () => selectGroup(g);
                    card.querySelector('[data-a="fold"]').onclick = () => { g.collapsed = !g.collapsed; rebuildIndex(); save(); dirty(); renderGroups(); };
                    card.querySelector('[data-a="color"]').onclick = () => {
                        g.accent = ACCENTS[(ACCENTS.indexOf(g.accent) + 1) % ACCENTS.length];
                        save(); dirty(); listDirty(); renderGroups();
                    };
                    card.querySelector('[data-a="del"]').onclick = () => {
                        for (const c of DOC.clips) if (c.group === g.id) c.group = null;
                        DOC.groups = DOC.groups.filter(x => x !== g);
                        rebuildIndex(); save(); dirty(); listDirty(); renderGroups(); toast('GROUP DISSOLVED');
                    };
                    grpStack.appendChild(card);
                }
            }

            // =========================================================
            // TUBES PANE
            // =========================================================
            function renderTubes() {
                tubStack.innerHTML = '';
                for (const t of DOC.tubes) {
                    const n = (IX.byTube.get(t.id) || []).length;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = '<div class="hd"><div class="dot" style="background:' + (t.id === S.tube ? '#19e6c8' : '#fff') + '"></div><input value="' + esc(t.name) + '" /></div>' +
                        '<small>' + n + ' CLIPS · ' + t.chN + ' CHANNELS</small>' +
                        '<div class="btns"><button data-a="go">ACTIVATE</button><button data-a="ch-">CH −</button><button data-a="ch+">CH +</button><button data-a="fit">FIT DUR + PACK</button>' + (DOC.tubes.length > 1 ? '<button data-a="del">DELETE</button>' : '') + '</div>';
                    card.querySelector('input').onchange = e => { t.name = e.target.value.toUpperCase().slice(0, 12) || t.name; save(); updateTubeChips(); dirty(); renderTubes(); };
                    card.querySelector('[data-a="go"]').onclick = () => { S.tube = t.id; updateTubeChips(); dirty(); renderTubes(); };
                    card.querySelector('[data-a="ch-"]').onclick = () => {
                        if (t.chN <= 2) return;
                        t.chN--;
                        for (const c of DOC.clips) if (c.tube === t.id) c.ch = Math.min(c.ch, t.chN - 1);
                        rebuildIndex(); save(); dirty(); renderTubes();
                    };
                    card.querySelector('[data-a="ch+"]').onclick = () => {
                        if (t.chN >= 8) return;
                        t.chN++;
                        rebuildIndex(); save(); dirty(); renderTubes();
                    };
                    card.querySelector('[data-a="fit"]').onclick = () => {
                        // apply real source durations where known, then pack each channel
                        const arr = IX.byTube.get(t.id) || [];
                        for (const c of arr) if (c.srcDur > 0) c.dur = Math.max(SNAP, Math.round(c.srcDur * U / SNAP) * SNAP);
                        const lanes = new Map();
                        for (const c of arr) { if (!lanes.has(c.ch)) lanes.set(c.ch, []); lanes.get(c.ch).push(c); }
                        for (const lane of lanes.values()) {
                            lane.sort((a, b) => a.start - b.start);
                            let cur = 0;
                            for (const c of lane) { c.start = cur; cur += c.dur + GAP; }
                        }
                        rebuildIndex(); save(); dirty(); listDirty(); toast('FIT + PACKED ' + t.name);
                    };
                    const del = card.querySelector('[data-a="del"]');
                    if (del) del.onclick = () => {
                        const dest = DOC.tubes.find(x => x !== t);
                        for (const c of DOC.clips) if (c.tube === t.id) { c.tube = dest.id; c.ch = Math.min(c.ch, dest.chN - 1); }
                        DOC.tubes = DOC.tubes.filter(x => x !== t);
                        if (S.tube === t.id) S.tube = dest.id;
                        rebuildIndex(); save(); updateTubeChips(); dirty(); renderTubes(); toast('TUBE DELETED — CLIPS MOVED');
                    };
                    tubStack.appendChild(card);
                }
                const add = document.createElement('button');
                add.textContent = '+ ADD TUBE';
                add.onclick = () => {
                    if (DOC.tubes.length >= 6) { toast('MAX 6 TUBES'); return; }
                    DOC.tubes.push({ id: uid('T'), name: 'TUBE-' + (DOC.tubes.length + 1), chN: 4 });
                    rebuildIndex(); save(); updateTubeChips(); dirty(); renderTubes();
                };
                tubStack.appendChild(add);
            }

            // =========================================================
            // PERSISTENCE + I/O
            // =========================================================
            function save() {
                try {
                    localStorage.setItem(SAVE, JSON.stringify({
                        v: 1, manifestName: S.manifestName, tubes: DOC.tubes, groups: DOC.groups,
                        clips: DOC.clips, nextId
                    }));
                } catch (e) { }
            }
            function load() {
                try {
                    const d = JSON.parse(localStorage.getItem(SAVE));
                    if (!d || !Array.isArray(d.clips)) return false;
                    DOC.tubes = d.tubes && d.tubes.length ? d.tubes : DOC.tubes;
                    DOC.groups = d.groups || [];
                    DOC.clips = d.clips;
                    nextId = d.nextId || DOC.clips.length + 1;
                    S.manifestName = d.manifestName || null;
                    S.tube = DOC.tubes[0].id;
                    return true;
                } catch (e) { return false; }
            }

            function download(text, name, type) {
                const b = new Blob([text], { type: type || 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b); a.download = name;
                document.body.appendChild(a); a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
            }

            $('loadManifest').onclick = () => { $('fileManifest').value = ''; $('fileManifest').click(); };
            $('fileManifest').onchange = e => {
                const f = e.target.files[0]; if (!f) return;
                f.text().then(t2 => {
                    try { loadManifest(JSON.parse(t2), f.name); }
                    catch (err) { toast('BAD JSON'); }
                });
            };
            $('linkMedia').onclick = () => {
                const inp = $('fileMedia');
                inp.value = '';
                // folder pickers are unsupported on some mobile browsers; fall back to multi-file
                if ('webkitdirectory' in inp) inp.click(); else { $('fileMediaFlat').value = ''; $('fileMediaFlat').click(); }
            };
            $('fileMedia').onchange = e => { if (e.target.files.length) linkMediaFiles([...e.target.files]); else { $('fileMediaFlat').value = ''; $('fileMediaFlat').click(); } };
            $('fileMediaFlat').onchange = e => { if (e.target.files.length) linkMediaFiles([...e.target.files]); };

            $('exportJson').onclick = () => {
                download(JSON.stringify({ v: 1, manifestName: S.manifestName, tubes: DOC.tubes, groups: DOC.groups, clips: DOC.clips }, null, 1), 'tube-arc-project.json', 'application/json');
                toast('PROJECT EXPORTED');
            };
            $('importJson').onclick = () => { $('fileProject').value = ''; $('fileProject').click(); };
            $('fileProject').onchange = e => {
                const f = e.target.files[0]; if (!f) return;
                f.text().then(t2 => {
                    try {
                        const d = JSON.parse(t2);
                        if (!Array.isArray(d.clips)) throw 0;
                        DOC.tubes = d.tubes && d.tubes.length ? d.tubes : [{ id: 'T1', name: 'MAIN', chN: 4 }];
                        DOC.groups = d.groups || []; DOC.clips = d.clips;
                        S.manifestName = d.manifestName || f.name; S.tube = DOC.tubes[0].id;
                        nextId = DOC.clips.length + DOC.groups.length + DOC.tubes.length + 2;
                        selectOnly(null); rebuildIndex(); computeTerms(); save(); toast('PROJECT IMPORTED');
                    } catch (err) { toast('BAD PROJECT FILE'); }
                });
            };
            $('exportEdl').onclick = () => {
                const t = tube(S.tube), arr = (IX.byTube.get(t.id) || []).slice().sort((a, b) => a.ch - b.ch || a.start - b.start);
                const tc = z => {
                    const s = z / U, hh2 = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = Math.floor(s) % 60, ff = Math.floor((s % 1) * 30);
                    return [hh2, mm, ss, ff].map(v => String(v).padStart(2, '0')).join(':');
                };
                let out = 'TITLE: TUBE ARC FLEET — ' + t.name + '\nFCM: NON-DROP FRAME\n\n';
                arr.forEach((c, i) => {
                    out += String(i + 1).padStart(3, '0') + '  CH' + (c.ch + 1) + '  V  C  ' + tc(0) + ' ' + tc(c.dur) + ' ' + tc(c.start) + ' ' + tc(c.start + c.dur) + '\n';
                    out += '* FROM CLIP NAME: ' + (c.vf || c.title) + (c.status !== 'ok' ? '  [' + c.status.toUpperCase() + ']' : '') + '\n\n';
                });
                download(out, 'tube-arc-' + t.name.toLowerCase() + '.edl');
                toast('EDL EXPORTED — ' + t.name);
            };
            $('stress').onclick = stress1000;
            $('wipe').onclick = () => {
                DOC.clips = []; DOC.groups = []; DOC.tubes = [{ id: 'T1', name: 'MAIN', chN: 4 }];
                S.tube = 'T1'; S.manifestName = null; selectOnly(null);
                rebuildIndex(); computeTerms(); save(); listDirty(); toast('WIPED');
            };

            // =========================================================
            // KEYBOARD
            // =========================================================
            addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT') return;
                const c = S.lastSel && IX.byId.get(S.lastSel);
                if (e.key === ' ') { e.preventDefault(); $('playBtn').onclick(); }
                else if (e.key >= '1' && e.key <= '4') { document.querySelectorAll('#rail [data-view]')[+e.key - 1].onclick(); }
                else if (e.key === 'ArrowLeft' && c && !c.locked) { c.start = Math.max(0, c.start - SNAP); rebuildIndex(); save(); dirty(); listDirty(); }
                else if (e.key === 'ArrowRight' && c && !c.locked) { c.start += SNAP; rebuildIndex(); save(); dirty(); listDirty(); }
                else if (e.key === 'ArrowUp' && c && !c.locked) { c.ch = Math.max(0, c.ch - 1); rebuildIndex(); save(); dirty(); }
                else if (e.key === 'ArrowDown' && c && !c.locked) { c.ch = Math.min(tube(c.tube).chN - 1, c.ch + 1); rebuildIndex(); save(); dirty(); }
                else if (e.key === 'Escape') selectOnly(null);
                else if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel.size) $('bDel').onclick();
            });

            // =========================================================
            // BOOT
            // =========================================================
            resize();
            if (!load()) { /* fresh start */ }
            rebuildIndex(); computeTerms();
            updateTubeChips(); renderGroups(); renderTubes();
            setTab('io');
            requestAnimationFrame(loop);
        })();
    </script>
</body>

</html>
