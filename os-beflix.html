<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORLD EYE · BEFLIX-128</title>
<!--
  BOOT AS CODE. Each boot loader was transcoded (monte_beflix.py) into BEFLIX-128
  animation code: CLR/PNT/LIN paint keyframes, REC holds, SHF moves. This player
  parses that code and re-runs it on a 128x96 dot grid — the boot rebuilt from
  its own source, playing beside the source. Not sampled: continuous.
-->
<style>
:root{--bg:#000;--phos:#19e6c8;--dim:#0d3a2c;--amber:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--phos);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--dim);
  font-size:10px;letter-spacing:.14em}
#bar b{color:var(--phos)} #bar .sp{flex:1}
#bar select,#bar button{background:#020a06;color:var(--phos);border:1px solid var(--dim);
  font:inherit;font-size:10px;padding:5px 8px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
#bar button:hover,#bar select:hover{border-color:var(--phos)}
#main{flex:1;display:flex;min-height:0}
#screen{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-right:1px solid var(--dim)}
#grid{image-rendering:pixelated;box-shadow:0 0 40px rgba(25,230,200,.15)}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55)),
    repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#screen.amber #grid{filter:hue-rotate(140deg) saturate(1.4)}
#codebox{width:min(42%,440px);display:flex;flex-direction:column;min-width:0}
#codehd{font-size:9px;letter-spacing:.1em;color:var(--dim);padding:7px 10px;border-bottom:1px solid var(--dim)}
#code{flex:1;overflow-y:auto;font-size:10px;line-height:1.5;padding:8px 10px;white-space:pre;color:var(--phos)}
#code .cm{color:var(--dim)} #code .cur{background:rgba(25,230,200,.18);color:#fff}
#code .op{color:var(--amber)}
#foot{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--dim);
  font-size:9px;letter-spacing:.1em;color:var(--dim);overflow-x:auto;white-space:nowrap}
#foot b{color:var(--phos)}
#foot button{background:#020a06;color:var(--phos);border:1px solid var(--dim);font:inherit;
  font-size:9px;padding:5px 9px;cursor:pointer}
#pick{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.95);display:none;overflow-y:auto;padding:14px}
#pick.on{display:block}
#pick .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#pick .c{border:1px solid var(--dim);cursor:pointer;background:#020a06;padding:8px}
#pick .c b{color:var(--phos);font-size:10px;display:block;letter-spacing:.06em}
#pick .c span{font-size:8px;color:var(--dim)}
#pick .c:hover{border-color:var(--phos)}
@media(max-width:720px){#main{flex-direction:column}#codebox{width:auto;height:38%;border-top:1px solid var(--dim)}
  #screen{border-right:0}}
</style>
</head>
<body>
<div class="wrap">
  <div id="bar"><b>WORLD EYE · BEFLIX-128</b><span id="title"></span><span class="sp"></span>
    <button id="ppBtn">❚❚</button>
    <select id="spd"><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option></select>
    <button id="amberBtn">AMBER</button>
    <button id="dotBtn">DOTS</button>
    <button id="pickBtn">BOOTS</button>
  </div>
  <div id="main">
    <div id="screen"><canvas id="grid" width="512" height="384"></canvas></div>
    <div id="codebox"><div id="codehd">SOURCE</div><div id="code"></div></div>
  </div>
  <div id="foot"><span id="stat">LOADING…</span><span class="sp" style="flex:1"></span>
    <button id="exportBtn">EXPORT .beflix</button></div>
</div>
<div id="pick"><div class="g" id="pickG"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const CV=$('grid'),CTX=CV.getContext('2d');
const W=128,HH=96,CELL=4;                     // 128*4 = 512 canvas
let INDEX=null,BOOTS=[],ops=[],frames=[],fi=0,playing=true,speed=1,dots=true;
let raf=null,acc=0,last=0,curOpLine=0;

async function boot(){
  INDEX=await fetch('MONTE/BEFLIX/beflix_index.json').then(r=>r.json()).catch(()=>null);
  if(!INDEX){$('stat').textContent='no beflix_index.json — run monte_beflix.py --all';return;}
  BOOTS=Object.entries(INDEX.boots).map(([pid,m])=>({pid,...m}))
    .sort((a,b)=>(a.ch||99)-(b.ch||99)||a.pid.localeCompare(b.pid));
  buildPicker();
  const q=location.hash.length>1?BOOTS.find(b=>b.pid===decodeURIComponent(location.hash.slice(1))):null;
  load(q||BOOTS[0]);
}
function buildPicker(){
  const g=$('pickG');g.innerHTML='';
  BOOTS.forEach(b=>{const d=document.createElement('div');d.className='c';
    d.innerHTML='<b>'+b.pid.replace(/^boot_/,'')+'</b><span>CH'+(b.ch||'·')+' · '+(b.kind||'')
      +' · '+b.keyframes+'kf/'+b.shifts+'shf · '+b.ops+' ops · Δ'+b.fidelity+'</span>';
    d.onclick=()=>{$('pick').classList.remove('on');load(b);};g.appendChild(d);});
}
$('pickBtn').onclick=()=>$('pick').classList.toggle('on');
$('amberBtn').onclick=()=>$('screen').classList.toggle('amber');
$('dotBtn').onclick=()=>{dots=!dots;};
$('ppBtn').onclick=()=>{playing=!playing;$('ppBtn').textContent=playing?'❚❚':'▶';};
$('spd').onchange=e=>speed=+e.target.value;
$('exportBtn').onclick=()=>{const t=$('code').textContent;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));
  a.download=(curPid||'boot')+'.beflix';a.click();};

let curPid='';
async function load(b){
  curPid=b.pid;
  $('title').textContent=' · '+b.pid.replace(/^boot_/,'')+' · '+b.keyframes+'kf · REC '+b.rec_sum;
  $('stat').innerHTML='CH<b>'+(b.ch||'·')+'</b> · '+b.frames+' src frames → '+b.keyframes
    +' keyframes + '+b.shifts+' shifts · '+b.ops+' ops · fidelity <b>Δ'+b.fidelity+'/7</b>';
  const text=await fetch('MONTE/BEFLIX/'+b.pid+'.beflix').then(r=>r.text());
  parse(text); renderCode(text);
  fi=0;acc=0;last=0;
  if(frames.length){draw(frames[0].g);highlight(frames[0].ln);}  // paint immediately
  if(!raf)raf=requestAnimationFrame(tick);
}
// ---- parse BEFLIX-128 -> a frame timeline (each op keeps its source line #) ----
function parse(text){
  const lines=text.split('\n');
  const grid=new Uint8Array(W*HH);frames=[];const line2frame=[];
  const bg=()=>{const c=new Uint16Array(8);for(let i=0;i<grid.length;i++)c[grid[i]]++;
    let m=0,mv=0;for(let v=0;v<8;v++)if(c[v]>m){m=c[v];mv=v;}return mv;};
  const push=(ln)=>{frames.push({g:grid.slice(),ln});};
  lines.forEach((raw,li)=>{
    const t=raw.trim().split(/\s+/);const o=t[0];
    if(o==='CLR')grid.fill(+t[1]);
    else if(o==='PNT'){const x=+t[1],y=+t[2],w=+t[3],h=+t[4],v=+t[5];
      for(let j=0;j<h;j++){const yy=y+j;if(yy<0||yy>=HH)continue;
        for(let i2=0;i2<w;i2++){const xx=x+i2;if(xx<0||xx>=W)continue;grid[yy*W+xx]=v;}}}
    else if(o==='LIN'){let x1=+t[1],y1=+t[2],x2=+t[3],y2=+t[4],v=+t[5];
      const dx=Math.abs(x2-x1),dy=Math.abs(y2-y1),sx=x1<x2?1:-1,sy=y1<y2?1:-1;let e=dx-dy;
      for(;;){if(x1>=0&&x1<W&&y1>=0&&y1<HH)grid[y1*W+x1]=v;
        if(x1===x2&&y1===y2)break;const e2=2*e;if(e2>-dy){e-=dy;x1+=sx;}if(e2<dx){e+=dx;y1+=sy;}}}
    else if(o==='REC'){for(let k=0;k<(+t[1]||1);k++)push(li);}
    else if(o==='SHF'){const dx=+t[1],dy=+t[2],n=+t[3];const b=bg();const ng=new Uint8Array(W*HH).fill(b);
      for(let y=0;y<HH;y++)for(let x=0;x<W;x++){const sxx=x-dx,syy=y-dy;
        if(sxx>=0&&sxx<W&&syy>=0&&syy<HH)ng[y*W+x]=grid[syy*W+sxx];}
      grid.set(ng);for(let k=0;k<(n||1);k++)push(li);}
  });
  if(!frames.length)push(0);
}
function renderCode(text){
  const box=$('code');box.innerHTML=text.split('\n').map((ln,i)=>{
    const cls=ln.startsWith('C')?'cm':/^(CLR|PNT|LIN|REC|SHF)/.test(ln.trim())?'op':'';
    return '<span data-l="'+i+'" class="'+cls+'">'+ln.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';
  }).join('\n');
}
// ---- draw a 128x96 grid as phosphor dots ----
function draw(g){
  CTX.fillStyle='#000';CTX.fillRect(0,0,CV.width,CV.height);
  for(let y=0;y<HH;y++)for(let x=0;x<W;x++){const v=g[y*W+x];if(!v)continue;
    const a=v/7;CTX.fillStyle='rgba(25,230,200,'+(0.25+a*0.75)+')';
    if(dots){const r=CELL*0.5*(0.4+a*0.6);
      CTX.beginPath();CTX.arc(x*CELL+CELL/2,y*CELL+CELL/2,r,0,6.283);CTX.fill();}
    else CTX.fillRect(x*CELL,y*CELL,CELL,CELL);}
}
function highlight(ln){
  if(ln===curOpLine)return;curOpLine=ln;
  const box=$('code');box.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));
  const el=box.querySelector('[data-l="'+ln+'"]');
  if(el){el.classList.add('cur');el.scrollIntoView({block:'nearest'});}
}
const FPS=8;
function tick(ts){
  raf=requestAnimationFrame(tick);
  if(!frames.length)return;
  if(!last)last=ts;const dt=(ts-last)/1000;last=ts;
  if(playing)acc+=dt*speed*FPS;
  while(acc>=1){acc-=1;fi=(fi+1)%frames.length;}
  const f=frames[fi];draw(f.g);highlight(f.ln);
}
boot();
</script>
</body>
</html>
