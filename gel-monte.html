<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>GEL MONTE — Monte-Carlo Fiction</title>
<style>
  :root{--bg:#0a0a0c;--ink:#f2f2ee;--dim:rgba(242,242,238,.5);--line:rgba(242,242,238,.22);
    --hot:#9fe7ff;--r1:#ff2e2e;--r2:#ff8c00;--r3:#ffd23f;--r4:#19e6c8;--r5:#7cfc00}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;
    scrollbar-width:thin;scrollbar-color:rgba(159,231,255,.45) #0a0a0c}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0a0a0c}
  ::-webkit-scrollbar-thumb{background:rgba(159,231,255,.3);border-radius:6px;border:2px solid #0a0a0c}
  ::-webkit-scrollbar-thumb:hover{background:#9fe7ff}
  ::-webkit-scrollbar-corner{background:#0a0a0c}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #app{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr}
  header{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);
    font-size:11px;font-weight:700;letter-spacing:.06em}
  header .stat{flex:1;text-align:center;color:var(--dim);font-weight:400;white-space:nowrap;overflow:hidden}
  header button{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
    font:inherit;font-size:10px;font-weight:700;padding:5px 10px;cursor:pointer;letter-spacing:.05em}
  header button.on{border-color:var(--hot);color:var(--hot)}
  /* workspace: vertical gel (lanes side by side) or linearized (rows stacked) */
  #space{position:relative;overflow:hidden}
  #lanes{position:absolute;inset:0;display:flex;gap:8px;padding:8px;overflow-x:auto;overflow-y:hidden}
  #lanes.horiz{flex-direction:column;overflow-x:hidden;overflow-y:auto}
  .lane{flex:0 0 var(--laneW,150px);display:flex;flex-direction:column;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;background:#000;position:relative}
  #lanes.horiz .lane{flex:0 0 var(--laneH,132px);flex-direction:row}
  .lanehd{display:flex;align-items:center;gap:5px;padding:5px 8px;border-bottom:1px solid var(--line);
    background:#0a0a0c;z-index:3;cursor:grab}
  #lanes.horiz .lanehd{flex-direction:column;border-bottom:none;border-right:1px solid var(--line);
    width:88px;justify-content:center;text-align:center}
  .lanehd b{font-size:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lanes.horiz .lanehd b{flex:0;white-space:normal;line-height:1.2}
  .lanehd i{font-style:normal;font-size:9px;color:var(--dim)}
  .lanehd .lx{border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--dim);
    font-size:9px;padding:1px 5px;cursor:pointer}
  .lanescroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;
    overscroll-behavior:contain}
  .lanescroll::-webkit-scrollbar{display:none}
  #lanes.horiz .lanescroll{overflow-y:hidden;overflow-x:auto;white-space:nowrap}
  .laneinner{position:relative}
  .band{position:absolute;left:3px;right:3px;border-radius:4px;overflow:hidden;background:#111;cursor:pointer}
  #lanes.horiz .band{left:auto;right:auto;top:3px;bottom:3px}
  .band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88;pointer-events:none}
  .band .edgeL{position:absolute;left:0;top:0;bottom:0;width:4px}
  .band .edgeR{position:absolute;right:0;top:0;bottom:0;width:4px}
  #lanes.horiz .band .edgeL{left:0;right:0;top:0;bottom:auto;width:auto;height:4px}
  #lanes.horiz .band .edgeR{left:0;right:0;bottom:0;top:auto;width:auto;height:4px}
  .band .bcap{position:absolute;left:6px;bottom:2px;right:6px;font-size:8px;color:#fff;
    text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;pointer-events:none}
  .band.selected{outline:2px solid var(--r5);outline-offset:1px}
  .band.gap{background:repeating-linear-gradient(45deg,#111,#111 4px,#181818 4px,#181818 8px)}
  .lane.off .lanescroll,.lane.off .mon{opacity:.15}
  .band .bx{position:absolute;top:2px;right:2px;z-index:2;border:none;border-radius:4px;
    background:rgba(180,0,0,.88);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;
    cursor:pointer;display:none;font-family:inherit}
  .band:hover .bx,.band.selected .bx{display:block}
  .band.inrange{outline:2px dashed var(--r4);outline-offset:1px}
  .band.hit{outline:2px solid var(--hot);outline-offset:1px;z-index:1}
  .band.hit img{opacity:1}
  .band.miss{opacity:.16}
  .band.mut img{filter:grayscale(1);opacity:.2}
  .band.mut .bcap::after{content:' OFF';color:var(--r1);font-weight:800}
  /* Mendeleev mechanics: subtle peek under the monitors; loupe does the magnifying */
  .band{transition:transform .12s ease-out,box-shadow .12s;transform-origin:center center}
  .band:hover{transform:scale(1.05);z-index:2;box-shadow:0 3px 10px rgba(0,0,0,.7)}
  #loupe{position:fixed;z-index:55;width:232px;background:#0d0d10;border:1px solid var(--hot);
    border-radius:10px;overflow:hidden;display:none;box-shadow:0 12px 40px rgba(0,0,0,.85)}
  #loupe img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  #loupe .lp{padding:8px 10px;font-size:10px;line-height:1.55}
  #loupe .lp b{display:block;font-size:11px;color:var(--hot);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #loupe .lp i{font-style:normal;color:var(--dim)}
  #loupe .lbtns{display:flex;gap:6px;padding:0 10px 10px}
  #loupe .lbtns button{flex:1;border:1px solid var(--line);border-radius:6px;background:transparent;
    color:var(--ink);font:inherit;font-size:9px;font-weight:700;padding:6px 0;cursor:pointer;letter-spacing:.04em}
  #loupe .lbtns button:hover{border-color:var(--hot);color:var(--hot)}
  #loupe video{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#000}
  header select{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
    font:inherit;font-size:10px;font-weight:700;padding:5px 6px;letter-spacing:.04em}
  /* mixer: focus one channel, dim the rest */
  .lane.focus{flex:0 0 340px !important;border-color:var(--hot)}
  #lanes.horiz .lane.focus{flex:0 0 300px !important}
  .lane.dimmed .lanescroll,.lane.dimmed .mon{opacity:.3}
  .lanehd .grip{color:var(--dim);cursor:grab;font-weight:800;letter-spacing:-2px;user-select:none}
  #brushes{display:flex;gap:4px;align-items:center}
  .chip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);cursor:pointer;
    display:grid;place-items:center;font-size:8px;color:var(--dim);font-weight:800}
  .chip.on{outline:2px solid var(--hot);outline-offset:1px}
  .chip.mutedC{opacity:.32;filter:grayscale(.7)}
  .band{user-select:none;-webkit-user-select:none}
  .band .cmark{position:absolute;top:2px;left:8px;width:10px;height:10px;border-radius:50%;
    border:1px solid #000;z-index:2;pointer-events:none}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
  .band.popped{animation:pop .18s ease-out}
  @media(pointer:coarse){#dropline{min-height:6px;min-width:6px}}
  #dropline{position:fixed;z-index:65;background:var(--r5);display:none;pointer-events:none;
    border-radius:2px;box-shadow:0 0 8px rgba(124,252,0,.8)}
  .band.txt{background:#0c0e0c}
  .band .btxt{position:absolute;inset:0;padding:3px 8px 3px 10px;font-size:8px;line-height:1.5;
    color:#c9cec7;overflow:hidden;pointer-events:none;white-space:normal;word-break:break-word}
  .band{contain:content}
  @media(max-width:760px){
    #app{grid-template-rows:auto 1fr}
    header{flex-wrap:wrap;padding:4px 8px;gap:6px;height:auto}
    #q{width:110px}
    #zoomrow{display:none}
  }
  .lane.droptgt{outline:2px solid var(--r5);outline-offset:-2px}
  #q{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font:inherit;font-size:10px;padding:5px 8px;width:170px;letter-spacing:.03em}
  #q:focus{outline:none;border-color:var(--hot)}
  #ctx{position:fixed;z-index:60;background:#111;border:1px solid var(--line);border-radius:10px;
    min-width:170px;display:none;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.7)}
  #ctx .ci{padding:8px 13px;font-size:11px;font-weight:700;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
  #ctx .ci:hover{background:rgba(159,231,255,.12)}
  #ctx .ci.dim{color:var(--dim);font-weight:400}
  #ghost{position:fixed;z-index:70;width:86px;height:52px;border:1px solid var(--hot);border-radius:6px;
    overflow:hidden;pointer-events:none;display:none;box-shadow:0 6px 20px rgba(0,0,0,.8)}
  #ghost img{width:100%;height:100%;object-fit:cover}
  #ghost .gn{position:absolute;top:2px;right:2px;background:#111;color:#fff;font-size:10px;
    font-weight:800;padding:1px 6px;border-radius:5px;border:1px solid var(--hot)}
  #loupe video{touch-action:none}
  #loupe .lcode{max-height:40vh;overflow-y:auto;background:#080a08;border-top:1px solid var(--hot);
    font-size:10.5px;line-height:1.6;display:none;overscroll-behavior:contain}
  #loupe .lchd{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;
    color:var(--hot);border-bottom:1px dashed rgba(159,231,255,.3);position:sticky;top:0;background:#080a08}
  #loupe .lchd button{border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--ink);
    font:inherit;font-size:8px;font-weight:700;padding:2px 7px;cursor:pointer}
  #loupe .lnr{display:flex;gap:7px;padding:1px 8px 1px 4px;cursor:pointer;white-space:pre-wrap;word-break:break-word}
  #loupe .lnr:hover{background:rgba(159,231,255,.1)}
  #loupe .lnr i{color:rgba(242,242,238,.35);min-width:24px;text-align:right;font-style:normal;
    user-select:none;flex:0 0 auto}
  #loupe .lnr.copied{background:rgba(124,252,0,.28)}
  #loupe .lnr.rd{background:rgba(159,231,255,.14);border-left:2px solid var(--hot)}
  /* the document room: code-editor modal for prompts */
  #docm{position:fixed;inset:3%;z-index:110;background:#0b0d0b;border:1px solid var(--hot);
    border-radius:12px;display:none;grid-template-rows:44px 1fr;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.9)}
  #docm.on{display:grid}
  #docVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;
    pointer-events:none;z-index:0}
  #docm .dochd{position:relative;z-index:2;background:rgba(8,10,8,.85)}
  #docBody{position:relative;z-index:2;background:rgba(8,10,8,.42)}
  #docCode .dln span{text-shadow:0 1px 3px #000}
  #docCode .dln.rd{background:rgba(159,231,255,.16);border-left:3px solid var(--hot)}
  #docSide{background:rgba(8,10,8,.92)}
  #docSnd.on{border-color:var(--hot);color:var(--hot)}
  .dochd{display:flex;gap:6px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);
    font-size:11px;flex-wrap:nowrap;overflow-x:auto}
  .dochd b{color:var(--hot);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px}
  .dochd .cnt{color:var(--dim);font-size:9px;white-space:nowrap}
  .dochd button{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);
    font:inherit;font-size:9px;font-weight:700;padding:4px 8px;cursor:pointer;flex:0 0 auto}
  .dochd button:hover{border-color:var(--hot);color:var(--hot)}
  #docBody{display:flex;min-height:0}
  #docCode{flex:1;overflow-y:auto;padding:10px 0 30vh;font-size:var(--docfs,13px);line-height:1.7;
    overscroll-behavior:contain}
  .dln{display:flex;gap:12px;padding:1px 14px 1px 6px;cursor:pointer;white-space:pre-wrap;word-break:break-word}
  .dln:hover{background:rgba(159,231,255,.08)}
  .dln i{color:rgba(242,242,238,.35);min-width:42px;text-align:right;font-style:normal;
    user-select:none;flex:0 0 auto}
  .dln.sel{background:rgba(124,252,0,.16);border-left:3px solid var(--r5)}
  #docSide{width:0;overflow:hidden;border-left:1px solid var(--line);transition:width .15s;
    overscroll-behavior:contain}
  #docSide.on{width:min(380px,44vw);overflow-y:auto}
  .dochd2{position:sticky;top:0;background:#0b0d0b;padding:8px 10px;font-size:10px;color:var(--hot);
    border-bottom:1px dashed rgba(159,231,255,.3);z-index:2}
  .simr{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:10px}
  .simr:hover{background:rgba(159,231,255,.08)}
  .simr b{display:block;color:var(--hot);font-size:9px;margin-bottom:2px}
  .simr span{color:#c9cec7;white-space:pre-wrap;word-break:break-word}
  .band{content-visibility:auto}
  @media(pointer:coarse){
    .lanehd .lx{padding:6px 9px;font-size:11px}
    header button{padding:8px 11px}
    .chip{width:20px;height:20px}
    .band .bx{display:block;opacity:.75}
  }
  /* read line + pinned monitors */
  #readline{position:absolute;left:0;right:0;top:32%;height:0;border-top:1px solid var(--hot);
    z-index:5;pointer-events:none;opacity:.8}
  #readline.horiz{left:32%;right:auto;top:0;bottom:0;height:auto;width:0;border-top:none;border-left:1px solid var(--hot)}
  .mon{position:absolute;z-index:4;width:calc(100% - 6px);left:3px;aspect-ratio:16/9;
    border:1px solid var(--hot);border-radius:6px;background:#000;overflow:hidden;pointer-events:none;
    box-shadow:0 4px 18px rgba(0,0,0,.6)}
  .mon video{width:100%;height:100%;object-fit:cover}
  .mon .mcap{position:absolute;left:0;right:0;bottom:0;font-size:8px;padding:1px 4px;color:var(--hot);
    background:rgba(0,0,0,.7);white-space:nowrap;overflow:hidden}
  /* pickers */
  dialog{border:1px solid var(--line);border-radius:12px;padding:12px;width:88%;max-width:340px;
    font-family:inherit;background:#111;color:var(--ink)}
  dialog .row{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:700;
    cursor:pointer;display:flex;justify-content:space-between}
  dialog .row i{font-style:normal;color:var(--dim)}
  dialog .grp{font-size:9px;letter-spacing:.1em;color:var(--dim);padding:8px 4px 2px}
  ::backdrop{background:rgba(0,0,0,.6)}
  #zoomrow{display:flex;align-items:center;gap:6px}
  #zoom{width:80px}
  #titleCard{position:fixed;inset:0;z-index:120;background:#000;display:grid;place-items:center;
    text-align:center;opacity:0;pointer-events:none;transition:opacity .8s}
  #titleCard.on{opacity:1}
  #titleCard i{display:block;font-style:normal;color:rgba(242,242,238,.55);font-size:14px;letter-spacing:.34em}
  #titleCard b{display:block;font-size:min(34px,6vw);letter-spacing:.14em;margin:14px 0 10px}
  #titleCard span{color:var(--hot);font-size:12px;letter-spacing:.14em}
  /* slot-machine control surface */
  #app{display:flex!important;flex-direction:column}
  #space{flex:1;min-height:0}
  #mainbar{display:flex;gap:6px;align-items:center;padding:6px 10px;
    border-bottom:1px solid var(--line);font-size:11px;flex-wrap:wrap}
  #mainbar b{font-size:12px;letter-spacing:.08em;margin-right:4px}
  #mainbar .grp{display:flex;gap:5px;align-items:center;padding:0 8px;
    border-left:1px solid rgba(255,255,255,.12)}
  #mainbar button{border:1px solid var(--line);border-radius:8px;background:transparent;
    color:var(--ink);font:inherit;font-size:10px;font-weight:700;padding:6px 11px;
    cursor:pointer;letter-spacing:.04em}
  #mainbar button.pri{background:var(--ink);color:#000}
  #mainbar button.on{border-color:var(--hot);color:var(--hot)}
  #mainbar .fader{display:flex;flex-direction:column;align-items:center;font-size:8px;color:var(--dim)}
  #mainbar .fader input{width:74px;height:14px}
  header{display:none!important}
  header.more{display:flex!important}
  #theatre{position:fixed;inset:0;z-index:200;background:#000;display:none}
  #theatre.on{display:block}
  #theatre video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #thSub{position:absolute;left:8%;right:8%;bottom:9%;text-align:center;font-size:17px;
    line-height:1.6;color:#fff;text-shadow:0 2px 8px #000,0 0 2px #000;pointer-events:none}
  #thHud{position:absolute;top:12px;left:14px;font-size:10px;color:rgba(255,255,255,.55);
    text-shadow:0 1px 2px #000}
  #thX{position:absolute;top:10px;right:12px;z-index:2;border:1px solid rgba(255,255,255,.4);
    border-radius:7px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-size:11px;
    font-weight:700;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="mainbar">
    <b>MONTE</b>
    <button id="spinBtn" class="pri" title="the lever: random era, fresh cut, straight to theatre">SPIN</button>
    <div class="grp">
      <button id="thBtn" title="focused channel, full screen, subtitles">THEATRE</button>
      <button id="cascBtn" title="autoplay every channel left to right">CASCADE</button>
    </div>
    <div class="grp">
      <div class="fader">SONG<input id="fSong" type="range" min="0" max="100" value="100"></div>
      <div class="fader">CLIPS<input id="fClip" type="range" min="0" max="100" value="100"></div>
    </div>
    <span id="mainstat" style="flex:1;text-align:center;color:var(--dim);
      white-space:nowrap;overflow:hidden;font-size:10px"></span>
    <button id="autoBtn" title="rules for generating more cuts">AUTO</button>
    <button id="moreBtn" title="the full gel control surface">MORE</button>
  </div>
  <header>
    <b>MONTE</b>
    <button id="rollBtn" title="monte-carlo: deal a film fitted to the focused era's song (no focus = all 14)">ROLL</button>
    <button id="twinBtn" title="import a world-press .twin.json chain as a film">TWIN</button>
    <button id="newBtn" title="fresh table: LIBRARY + one empty film">NEW</button>
    <button id="addLane">+ LANE</button>
    <button id="rainBtn" title="all films + all families as lanes">RAIN</button>
    <button id="playBtn" title="all lanes fall and play at once">PLAY</button>
    <input id="q" placeholder="SEARCH GENOME" spellcheck="false">
    <button id="qMode" title="GLOW highlights matches / MORPH collapses lanes to matches">GLOW</button>
    <button id="undoBtn" title="cmd+Z">UNDO</button>
    <button id="syncBtn" class="on">SYNC</button>
    <button id="normBtn" title="every channel same visual length: scroll = % of film">NORM</button>
    <button id="textBtn" title="see the prompt that made each clip">TEXT</button>
    <button id="linBtn">LINEARIZE</button>
    <select id="groupBy" title="reorganize all channels by a facet">
      <option value="films">BY FILM</option><option value="world">BY WORLD</option>
      <option value="rating">BY RATING</option><option value="luminance">BY LUMINANCE</option>
      <option value="domain">BY DOMAIN</option><option value="palette">BY PALETTE</option>
      <option value="motion">BY MOTION</option>
      <option value="events">BY EVENT</option>
      <option value="objects">BY OBJECT</option></select>
    <button id="rowBtn" title="grab the clips under the read line across all channels">ROW</button>
    <div id="brushes" title="pick a color, then click bands to mark them">
      <span class="chip" data-c="#c0392b" style="background:#c0392b"></span>
      <span class="chip" data-c="#e67e22" style="background:#e67e22"></span>
      <span class="chip" data-c="#f1c40f" style="background:#f1c40f"></span>
      <span class="chip" data-c="#0a7d43" style="background:#0a7d43"></span>
      <span class="chip" data-c="#2457a0" style="background:#2457a0"></span>
      <span class="chip" data-c="clear">X</span>
    </div>
    <button id="expBtn" title="export every ON channel as one JSON bundle">EXPORT</button>
    <span class="stat" id="stat"></span>
    <div id="zoomrow"><i style="font-size:9px;color:var(--dim)">ZOOM</i>
      <input type="range" id="zoom" min="3" max="18" value="7"></div>
    <button id="sndBtn">SOUND</button>
  </header>
  <div id="space">
    <div id="lanes"></div>
    <div id="readline"></div>
  </div>
</div>
<audio id="songA"></audio>
<div id="theatre"><video id="thv" playsinline preload="auto"></video>
  <div id="thSub"></div><div id="thHud"></div><button id="thX">EXIT</button></div>
<div id="titleCard"></div>
<input type="file" id="twinFile" accept=".json" style="display:none">
<dialog id="pick"><b>Add lane</b><div id="pickBody" style="max-height:62vh;overflow-y:auto;margin-top:6px"></div>
  <button style="width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:8px" onclick="document.getElementById('pick').close()">cancel</button></dialog>

<script>
(async () => {
const $=id=>document.getElementById(id);
function safeSet(k,v){
  try{localStorage.setItem(k,v);return true;}
  catch(err){
    console.warn('storage full, not saved:',k,err);
    try{
      let worst=['',0];
      for(let i=0;i<localStorage.length;i++){const kk=localStorage.key(i);
        const n=(localStorage.getItem(kk)||'').length; if(n>worst[1])worst=[kk,n];}
      flash('STORAGE FULL — '+k+' NOT SAVED. Biggest: '+worst[0]+' ('
        +Math.round(worst[1]/1024)+'KB). Clear it in hub.html STORAGE.',false);
    }catch(e2){}
    return false;
  }
}
const M=await fetch('MONTE/monte_manifest.json').then(r=>r.json());
const clips={}, facets={named_film:{}};
const SONGS={}, ERAS=[];

    clips[id]={clip_id:id,index:e.n+'.'+(i+1),title:c.title,duration:c.duration,
      media_url:'MONTE/assets/'+id,pid:c.pid,era:e.slug,domain:e.title.toLowerCase(),
      world:e.title,timestamp:e.slug+'/'+c.file,named_films:[eraTitle],
      named_films_l:eraTitle.toLowerCase(),objects:[],events:[],scenes:[],
      film_function:[],style_terms:[],prompt_excerpt:c.title,transcript:'',

const posterOf=id=>{const c=clips[id];return c&&c.pid?('MONTE/POSTERS/'+c.pid+'.jpg'):'';};

const LUM={dark:'#26324a',twilight:'#6b7a99',luminous:'#ffe9a8'};
const clipMarks=JSON.parse(localStorage.getItem('monteMarks')||'{}');
function saveCMarks(){safeSet('monteMarks',JSON.stringify(clipMarks));}
const BRUSH_HEX={red:'#c0392b',orange:'#e67e22',yellow:'#f1c40f',green:'#0a7d43',blue:'#2457a0'};
const mutedColors=new Set(JSON.parse(localStorage.getItem('monteMuted')||'[]'));

function savePls(){safeSet('montePls',JSON.stringify(S.pls));}
function dur(id){return clips[id]&&clips[id].duration||10;}
function fmts(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
const SR={};
function srch(id){if(SR[id])return SR[id];const c=clips[id]||{};
  return SR[id]=[c.title,c.world,c.named_films_l,(c.objects||[]).join(' '),(c.events||[]).join(' '),
    c.transcript,c.prompt_excerpt,c.domain,c.mode,c.voice,c.luminance,c.motion,c.palette,
    'r'+c.rating,c.editorial,(c.film_function||[]).join(' '),(c.scenes||[]).join(' '),
    (c.style_terms||[]).join(' ')].join(' ').toLowerCase();}
let QT=[];
function matches(id){return QT.every(t=>{
  if(t.startsWith('mark:'))return clipMarks[id]===BRUSH_HEX[t.slice(5)];
  return srch(id).includes(t);});}
const POOLS={};
function poolsAll(field){
  if(!POOLS[field]){
    const m={};
    Object.keys(clips).forEach(id=>{
      const v=clips[id][field];
      const push=x=>{(m[x]=m[x]||[]).push(id);};
      if(Array.isArray(v)){ if(v.length)v.forEach(push); else push('(none)'); }
      else push((v==null||v==='')?'(none)':v);
    });
    Object.values(m).forEach(a=>a.sort((x,y)=>(clips[x].timestamp||'')<(clips[y].timestamp||'')?-1:1));
    POOLS[field]=m;
  }
  return POOLS[field];
}
const SORTS={
  time:(a,b)=>(clips[a].timestamp||'')<(clips[b].timestamp||'')?-1:1,
  rating:(a,b)=>(+clips[b].rating||0)-(+clips[a].rating||0),
  duration:(a,b)=>dur(a)-dur(b),
  luminance:(a,b)=>String(clips[a].luminance).localeCompare(String(clips[b].luminance)),
  shuffle:()=>Math.random()-0.5};
function laneIds(l){
  let ids=[];
  if(l.kind==='film'&&S.pls[l.name])ids=SECTIONS.flatMap(k=>S.pls[l.name][k]||[]);
  else if(l.kind==='family')ids=(facets.named_film[l.name]||[])
    .filter(id=>!(l.hide||[]).includes(id))
    .slice().sort((a,b)=>(clips[a].timestamp||'')<(clips[b].timestamp||'')?-1:1);
  else if(l.kind==='facet')ids=(poolsAll(l.field)[l.value]||[])
    .filter(id=>!(l.hide||[]).includes(id));
  else if(l.kind==='search'){
    const base=S.q?Object.keys(clips).filter(matches):Object.keys(clips).filter(id=>clipMarks[id]);
    ids=base.filter(id=>!(l.hide||[]).includes(id)).sort(SORTS.time);
  }
  else if(l.kind==='query')ids=Object.keys(clips)
    .filter(id=>!(l.hide||[]).includes(id)).sort(SORTS.time);
  if(l.q){const terms=l.q.toLowerCase().split(/\s+/).filter(Boolean);
    ids=ids.filter(id=>terms.every(t=>t.startsWith('mark:')
      ?clipMarks[id]===BRUSH_HEX[t.slice(5)]:srch(id).includes(t)));}
  if(l.kind==='search'||l.kind==='query')ids=ids.slice(0,300);
  if(l.sort&&l.kind!=='film')ids=ids.slice().sort(SORTS[l.sort]);
  if(S.q&&S.qmode==='morph')ids=ids.filter(matches);
  return ids;
}
// default lanes: the 14 eras, in order

// ---------- BUILD ----------
const laneEls=[];
let builtPps=7;
function build(){
  if(S.focus&&!S.lanes.some(l=>l.name===S.focus))S.focus=null;
  const holder=$('lanes');
  const keptH=S.horiz;
  const kept=laneEls.map(r=>(keptH?r.scroll.scrollLeft:r.scroll.scrollTop)/(r.pps||builtPps));
  holder.innerHTML=''; laneEls.length=0;
  const normTarget=Math.max(800,((S.horiz?holder.clientWidth:holder.clientHeight)-60)*3*(S.pps/7));
  holder.classList.toggle('horiz',S.horiz);
  const effW=innerWidth<760?Math.max(96,Math.min(S.laneW,Math.floor(innerWidth*0.36))):S.laneW;
  holder.style.setProperty('--laneW',effW+'px');
  $('readline').classList.toggle('horiz',S.horiz);
  S.lanes.forEach((l,li)=>{
    const ids=laneIds(l);
    const total=ids.reduce((s,id)=>s+dur(id),0);
    const el=document.createElement('div');
    el.className='lane'+(l.off?' off':'')+(S.focus?(S.focus===l.name?' focus':' dimmed'):'');
    el.innerHTML=`<div class="lanehd"><span class="grip">::</span><b>${l.name}</b><i>${ids.length} · ${fmts(total)}${l.q&&l.kind!=='query'?' · "'+l.q+'"':''}</i>
      <button class="lx" data-a="f" title="focus: big + sound">${S.focus===l.name?'*':'F'}</button>
      ${S.focus===l.name?'<button class="lx" data-a="doc" title="read the whole channel as one document">DOC</button><button class="lx" data-a="cp" title="copy channel as prompt script">CP</button><button class="lx" data-a="ex" title="export channel JSON">EX</button>':''}
      <button class="lx" data-a="o">${l.off?'OFF':'ON'}</button>
      <button class="lx" data-a="x">X</button></div>
      <div class="lanescroll"><div class="laneinner"></div></div>
      <div class="mon"><video muted playsinline preload="metadata"></video><div class="mcap"></div></div>`;
    el.querySelector('[data-a=x]').onclick=()=>{pushUndo();S.lanes.splice(li,1);saveLanes();build();};
    el.querySelector('[data-a=o]').onclick=()=>{l.off=!l.off;saveLanes();build();};
    el.querySelector('[data-a=f]').onclick=()=>{S.focus=S.focus===l.name?null:l.name;build();};
    const cpB=el.querySelector('[data-a=cp]');
    if(cpB){cpB.onclick=()=>copyLaneText(l);
      el.querySelector('[data-a=ex]').onclick=()=>exportLane(l);
      el.querySelector('[data-a=doc]').onclick=()=>docOpenChannel&&docOpenChannel(l);}
    el.querySelector('.lanehd').oncontextmenu=e=>{e.preventDefault();laneMenu(e,l,li);};
    // header click = move selected band (or COPY selected segment) into this lane (films only)
    el.querySelector('.lanehd').onclick=e=>{
      if(e.target.dataset.a)return;
      if(S.range&&l.kind==='film'){
        pushUndo();
        const srcR=laneEls.find(r=>r.l===S.range.lane);
        const segIds=srcR?srcR.offsets.slice(S.range.from,S.range.to+1).map(o=>o.id):[];
        (S.pls[l.name].MIDDLE=S.pls[l.name].MIDDLE||[]).push(...segIds);
        S.range=null; S.sel=null; savePls(); build(); return;
      }
      if(S.sel&&l.kind==='film'){
        pushUndo();
        if(S.sel.lane&&S.sel.lane.kind==='film'){
          for(const sec of SECTIONS){
            const a=S.pls[S.sel.lane.name][sec]||[];
            const k=a.indexOf(S.sel.id); if(k>=0){a.splice(k,1);break;}
          }
        }
        (S.pls[l.name].MIDDLE=S.pls[l.name].MIDDLE||[]).push(S.sel.id);
        S.sel=null; savePls(); build();
      }
    };
    const inner=el.querySelector('.laneinner');
    const lanePps=(S.norm&&total>0)?Math.max(0.05,normTarget/total):S.pps;
    let acc=0;
    const offsets=[];
    ids.forEach((id,k)=>{
      const c=clips[id];
      const px=Math.max(S.norm?2:14,dur(id)*lanePps);
      const b=document.createElement('div'); b.className='band'+(S.textMode?' txt':'');
      if(S.horiz){b.style.left=acc+'px';b.style.width=(px-2)+'px';}
      else{b.style.top=acc+'px';b.style.height=(px-2)+'px';}
      const esc=s2=>String(s2||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      b.innerHTML=`${S.textMode
          ?`<div class="btxt">#${c.index} ${esc(c.prompt_excerpt||c.title).slice(0,240)}</div>`
          :`<img loading="lazy" decoding="async" src="${posterOf(id)}" onerror="this.style.opacity=.1">`}
        <div class="edgeL" style="background:${RATE[c.rating]||'transparent'}"></div>
        <div class="edgeR" style="background:${LUM[c.luminance]||'#333'}"></div>
        <div class="bcap">${S.textMode?'':'#'+c.index}</div><button class="bx">X</button>
        ${clipMarks[id]?`<div class="cmark" style="background:${clipMarks[id]}"></div>`:''}`;
      b.dataset.li=li; b.dataset.k=k;
      if((l.mute||[]).includes(id))b.classList.add('mut');
      if(S.q&&S.qmode==='glow')b.classList.add(matches(id)?'hit':'miss');
      b.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();bandMenu(e,l,k,id);};
      if(S.sel&&S.sel.id===id&&S.sel.lane===l&&S.sel.k===k)b.classList.add('selected');
      if(S.range&&S.range.lane===l&&k>=S.range.from&&k<=S.range.to)b.classList.add('inrange');
      b.onclick=e=>{
        if(e.target.classList.contains('bx'))return;
        // brush active: click paints, nothing else moves — solitaire stacking
        if(S.brush){paintId(b);return;}
        // molecular grouping: pure DOM mutation, never rebuild (scroll stays put)
        if(e.shiftKey&&S.sel&&S.sel.lane===l){
          S.range={lane:l,from:Math.min(S.sel.k,k),to:Math.max(S.sel.k,k)};
          document.querySelectorAll('.band').forEach(bx=>{
            const on=+bx.dataset.li===li&&+bx.dataset.k>=S.range.from&&+bx.dataset.k<=S.range.to;
            bx.classList.toggle('inrange',on);
          });
          return;
        }
        S.range=null;
        const same=S.sel&&S.sel.id===id&&S.sel.lane===l&&S.sel.k===k;
        document.querySelectorAll('.band.selected,.band.inrange')
          .forEach(x=>x.classList.remove('selected','inrange'));
        if(!same){S.sel={id,lane:l,k};b.classList.add('selected');openLoupe(b,l,k,id);}
        else{S.sel=null;closeLoupe();} };
      b.querySelector('.bx').onclick=e=>{e.stopPropagation();removeBands(l,[k]);};
      offsets.push({id,start:acc/lanePps,dur:dur(id)});
      acc+=px;
      inner.appendChild(b);
    });
    if(S.horiz){inner.style.width=acc+'px';inner.style.height='100%';inner.style.display='inline-block';}
    else{inner.style.height=acc+'px';inner.style.width='100%';}
    // end spacer: lets every band scroll past the read line, even short films
    const spacer=document.createElement('div');
    if(S.horiz){spacer.style.cssText='display:inline-block;width:70vw;height:1px';}
    else{spacer.style.cssText='height:70vh;width:1px';}
    el.querySelector('.lanescroll').appendChild(spacer);
    const rec={el,l,offsets,total,pps:lanePps,scroll:el.querySelector('.lanescroll'),
      mon:el.querySelector('.mon'),vid:el.querySelector('video'),
      mcap:el.querySelector('.mcap'),curClip:null,lastSeek:0};
    laneEls.push(rec);
    wireLane(rec);
    holder.appendChild(el);
  });
  const add=document.createElement('div'); add.className='lane';
  add.style.cssText='flex:0 0 60px;display:grid;place-items:center;border-style:dashed;cursor:pointer;color:var(--dim);font-weight:700;font-size:18px';
  add.textContent='+'; add.onclick=openPicker;
  holder.appendChild(add);
  // lead spacer: push content down so t=0 sits exactly on the read line
  laneEls.forEach(r=>{
    const inner=r.scroll.querySelector('.laneinner');
    const v=S.horiz?r.scroll.clientWidth:r.scroll.clientHeight;
    if(S.horiz){inner.style.marginLeft=(v*0.32)+'px';inner.style.marginTop='';}
    else{inner.style.marginTop=(v*0.32)+'px';inner.style.marginLeft='';}
  });
  restoreUntil=performance.now()+300;  // clamped short lanes must not sync-drag the fleet
  if(keptH===S.horiz)laneEls.forEach((r,i)=>{ if(kept[i]!=null){
    const px=kept[i]*(r.pps||S.pps);
    if(S.horiz)r.scroll.scrollLeft=px; else r.scroll.scrollTop=px; } });
  builtPps=S.pps;
  baseStat=S.lanes.length+' lanes · '+(S.horiz?'HORIZONTAL':'VERTICAL')+' · '
    +(S.norm?'NORM':S.pps+'px/s')
    +(S.q?' · Q:'+S.q.toUpperCase()+' ['+S.qmode.toUpperCase()+']':'');
  $('stat').textContent=baseStat;
  $('undoBtn').textContent=UNDO.length?('UNDO '+UNDO.length):'UNDO';
  positionMons();
  laneEls.forEach(readLane);
  applySound();
}
function positionMons(){
  laneEls.forEach(r=>{
    if(S.horiz){
      r.mon.style.left='32%'; r.mon.style.top='6px'; r.mon.style.width='170px';
      r.mon.style.transform='translateX(-50%)';
    } else {
      r.mon.style.top='32%'; r.mon.style.left='3px'; r.mon.style.width='calc(100% - 6px)';
      r.mon.style.transform='translateY(-50%)';
    }

}

// ---------- READ LINE: scroll = scrub ----------
function removeBands(l,ks){
  const r=laneEls.find(x=>x.l===l); if(!r)return;
  pushUndo();
  const ids=ks.map(k=>r.offsets[k]&&r.offsets[k].id).filter(Boolean);
  if(l.kind==='film'){
    ids.forEach(id=>{for(const sec of SECTIONS){const a=S.pls[l.name][sec]||[];
      const i=a.indexOf(id); if(i>=0){a.splice(i,1);break;}}});
    savePls();
  } else { l.hide=(l.hide||[]).concat(ids); saveLanes(); }
  S.sel=null; S.range=null; build();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Delete'&&e.key!=='Backspace')return;
  if(S.range){e.preventDefault();
    const ks=[];for(let k=S.range.from;k<=S.range.to;k++)ks.push(k);
    removeBands(S.range.lane,ks);}
  else if(S.sel&&S.sel.k!=null){e.preventDefault();removeBands(S.sel.lane,[S.sel.k]);}
});
function readLane(r){
  if(r.l.off){r.mon.style.display='none';r.vid.pause();return;}
  const sc=r.scroll;
  const t=(S.horiz?sc.scrollLeft:sc.scrollTop)/(r.pps||S.pps);
  // a locked clip owns this lane's viewing: the loupe scrubs with the scroll, monitor yields
  if(loupeCtx&&loupeCtx.l===r.l){
    r.mon.style.display='none'; r.vid.pause();
    loupeScrub(r,t);
    return;
  }
  let k=r.offsets.findIndex(o=>t>=o.start&&t<o.start+o.dur);
  if(k<0){r.mon.style.display='none';return;}
  const o=r.offsets[k], local=t-o.start;
  if((r.l.mute||[]).includes(o.id)){r.mon.style.display='none';r.vid.pause();return;}
  const mkc=clipMarks[o.id];
  if(mkc&&mutedColors.has(mkc)){r.mon.style.display='none';r.vid.pause();return;}
  r.mon.style.display='block';
  if(r.curClip!==o.id){
    r.curClip=o.id;
    r.vid.src=previewOf(o.id);
    r.mcap.textContent='#'+clips[o.id].index+' '+(clips[o.id].title||'').slice(0,22)+' @'+local.toFixed(1)+'s';
    r.vid.addEventListener('loadedmetadata',()=>{r.vid.currentTime=Math.min(local,(r.vid.duration||o.dur)-.05);
      if(S.playing)r.vid.play().catch(()=>{});},{once:true});
  } else if(S.playing){
    if(r.vid.paused&&r.vid.readyState>=2)r.vid.play().catch(()=>{});
    r.mcap.textContent='#'+clips[o.id].index+' '+(clips[o.id].title||'').slice(0,22)+' @'+local.toFixed(1)+'s';
  } else {
    const now=performance.now();
    if(now-r.lastSeek>90){
      r.lastSeek=now;
      if(r.vid.readyState>=1)r.vid.currentTime=Math.min(local,(r.vid.duration||o.dur)-.05);
      r.mcap.textContent='#'+clips[o.id].index+' '+(clips[o.id].title||'').slice(0,22)+' @'+local.toFixed(1)+'s';
    }
  }
}
function wireLane(r){
  // swipe across a band = automatic scrub of that clip in the lane monitor
  r.scroll.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse'||dragB||S.brush)return;
    if(loupeCtx&&loupeCtx.l===r.l)return;
    const b=e.target.closest('.band'); if(!b)return;
    const k=+b.dataset.k, o=r.offsets[k]; if(!o)return;
    const br=b.getBoundingClientRect();
    const frac=S.horiz?((e.clientY-br.top)/br.height):((e.clientX-br.left)/br.width);
    const local=Math.max(0,Math.min(Math.max(0,o.dur-0.05),frac*o.dur));
    const now=performance.now();
    if(now-r.lastSeek<90)return;
    r.lastSeek=now;
    r.mon.style.display='block';
    if(r.curClip!==o.id){
      r.curClip=o.id; r.vid.src=previewOf(o.id);
      r.vid.addEventListener('loadedmetadata',()=>{r.vid.currentTime=local;},{once:true});
    } else if(r.vid.readyState>=1){r.vid.currentTime=local;}
    r.mcap.textContent='#'+clips[o.id].index+' @'+local.toFixed(1)+'s ~';
  },{passive:true});
  r.scroll.addEventListener('scroll',()=>{
    if(loupeCtx&&loupeCtx.l===r.l)loupeCtx.hold=false;
    readLane(r);
    if(S.sync&&!S.syncing&&!S.playing&&performance.now()>restoreUntil){
      S.syncing=true;
      const v=S.horiz?r.scroll.scrollLeft:r.scroll.scrollTop;
      laneEls.forEach(o=>{ if(o!==r){ if(S.horiz)o.scroll.scrollLeft=v; else o.scroll.scrollTop=v; readLane(o);} });
      S.syncing=false;
    }
  },{passive:true});
}

async function loupeCode(id){
  const box=loupe.querySelector('.lcode'); if(!box)return;
  const txt=await rawPrompt(id);
  if(!loupeCtx||loupeCtx.id!==id)return;   // stale fetch: user moved on
  const lines=String(txt).replace(/\r/g,'').split('\n');
  const esc=s2=>String(s2).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  box.innerHTML='<div class="lchd">FULL PROMPT · '+lines.length+' LINES · #'+((clips[id]||{}).index||'')
    +' <span><button data-a="expand">EXPAND</button> <button data-a="cpall">COPY ALL</button></span></div>'
    +lines.map((ln,i)=>'<div class="lnr" data-i="'+i+'"><i>'+(i+1)+'</i><span>'+(esc(ln)||' ')+'</span></div>').join('');
  box.querySelector('[data-a=cpall]').onclick=()=>{
    navigator.clipboard.writeText(txt).then(()=>flash('FULL PROMPT COPIED',false),()=>{});};
  box.querySelector('[data-a=expand]').onclick=()=>docOpen(id);
  box.querySelectorAll('.lnr').forEach(row=>{
    row.onclick=()=>{
      const i=+row.dataset.i;
      navigator.clipboard.writeText(lines[i]||'').then(()=>{},()=>{});
      row.classList.add('copied');
      setTimeout(()=>row.classList.remove('copied'),450);
      flash('LINE '+(i+1)+' COPIED',false);
    };
  });
  // TEXT IS VIDEO: your reading position IS the playhead, in both directions
  const v=loupe.querySelector('video');
  let progT=0, userT=0;
  const markRead=i=>{
    const cur=box.querySelector('.lnr.rd'); if(cur)cur.classList.remove('rd');
    const row=box.querySelector('.lnr[data-i="'+i+'"]'); if(row)row.classList.add('rd');
  };
  box.onscroll=()=>{
    if(performance.now()-progT<140)return;   // that was us, not the reader
    userT=performance.now();
    const max=box.scrollHeight-box.clientHeight; if(max<=0)return;
    const frac=Math.max(0,Math.min(1,box.scrollTop/max));
    if(v&&v.duration)v.currentTime=frac*v.duration;
    markRead(Math.round(frac*(lines.length-1)));
  };
  if(v){
    v.onclick=()=>{v.paused?v.play().catch(()=>{}):v.pause();};
    v.ontimeupdate=()=>{
      if(!v.duration||box.style.display!=='block')return;
      if(performance.now()-userT<800)return;   // the reader is driving
      const frac=v.currentTime/v.duration;
      const max=box.scrollHeight-box.clientHeight;
      progT=performance.now();
      if(max>0)box.scrollTop=frac*max;
      markRead(Math.round(frac*(lines.length-1)));
    };
  }
}

function loupeScrub(r,t){
  let o=r.offsets[loupeCtx.k]; if(!o)return;
  // stay relevant: when the horizon leaves this clip, follow it to the next one
  // (but never on open — the click wins until the user scrolls)
  if(!loupeCtx.hold&&(t<o.start||t>=o.start+o.dur)){
    const k2=r.offsets.findIndex(x=>t>=x.start&&t<x.start+x.dur);
    if(k2>=0&&k2!==loupeCtx.k){retargetLoupe(r,k2); o=r.offsets[k2];}
    else if(k2<0)return;
  }
  const v=loupe.querySelector('video'); if(!v)return;
  const local=Math.min(Math.max(t-o.start,0),Math.max(0,o.dur-0.05));
  const inside=t>=o.start&&t<o.start+o.dur;
  if(S.playing&&inside){ if(v.paused)v.play().catch(()=>{}); return; }
  const now=performance.now();
  if(v.readyState>=1&&now-loupeSeek>90){
    loupeSeek=now; if(!v.paused)v.pause(); v.currentTime=local;
  }
}

let loupeJog=0;
loupe.addEventListener('pointermove',e=>{
  const v=loupe.querySelector('video'); if(!v||!v.duration)return;
  if(!v.paused)return;   // playing = reading flow; jog only when paused
  const vr=v.getBoundingClientRect();
  if(e.clientY<vr.top||e.clientY>vr.bottom)return;
  const now=performance.now(); if(now-loupeJog<60)return; loupeJog=now;
  const frac=Math.max(0,Math.min(1,(e.clientX-vr.left)/vr.width));
  v.currentTime=frac*v.duration;
});

const UNDO=[]; let ops=0, baseStat='', flashT=null;
function pushUndo(){UNDO.push({p:JSON.stringify(S.pls),l:JSON.stringify(S.lanes),
  m:JSON.stringify(clipMarks)});
  if(UNDO.length>60)UNDO.shift();}
function doUndo(){const u=UNDO.pop();
  if(!u){flash('NOTHING TO UNDO',false);return;}
  S.pls=JSON.parse(u.p);S.lanes=JSON.parse(u.l);savePls();saveLanes();
  if(u.m){Object.keys(clipMarks).forEach(k2=>delete clipMarks[k2]);
    Object.assign(clipMarks,JSON.parse(u.m));saveCMarks();}
  S.sel=null;S.range=null;build();flash('UNDONE · '+UNDO.length+' STEPS LEFT',false);}
$('undoBtn').onclick=doUndo;
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();doUndo();}});
function flash(m,edit=true){if(edit)ops++;
  $('stat').textContent=m+(edit?' · '+ops+' EDITS':'');

function copyLaneText(l){

    return (i+1)+'. [#'+c2.index+' · '+Math.round(dur(id2))+'s] '+(c2.title||'')
      +'\nPROMPT: '+(c2.prompt_excerpt||'')
      +(c2.transcript?'\nVOICE: '+c2.transcript:'');

function exportLane(l){

    count:ids.length,total_seconds:+ids.reduce((s,id)=>s+dur(id),0).toFixed(2),
    clips:ids.map(id=>Object.assign({},clips[id],{mark:clipMarks[id]||null}))};

let FINALS_MAP=null, LOCAL_FINALS=null;
async function finalUrl(id){
  const c=clips[id]||{};

    try{const r=await fetch(c.media_url||'FINAL_CLIPS/none',{method:'HEAD'});LOCAL_FINALS=r.ok;}
    catch(e){LOCAL_FINALS=false;}
  }
  if(LOCAL_FINALS&&c.media_url)return c.media_url;
  if(!FINALS_MAP){
    try{FINALS_MAP=await fetch('finals_urls.json').then(r=>r.json());}

// TEXT AS TIMELINE: the document scroll IS the playhead — for one clip OR a whole channel
let docOpenChannel=null;
{
  const dCode=$('docCode'), dVid=$('docVid');
  let dProgTop=-1, dUserT=0, docSeg=null;
  const clamp01=x=>Math.max(0,Math.min(1,x));
  const dMarkRead=frac=>{
    const n=docCtx?docCtx.lines.length:0; if(!n)return;
    const i=Math.round(frac*(n-1));
    const cur=dCode.querySelector('.dln.rd');
    if(cur&&+cur.dataset.i!==i)cur.classList.remove('rd');
    const row=dCode.querySelector('.dln[data-i="'+i+'"]');
    if(row)row.classList.add('rd');
  };
  function chanSetVideo(sg,local,thenPlay){
    docSeg=sg;
    const want=previewOf(sg.id);
    if(!dVid.src.endsWith(want)){
      dVid.src=want;
      dVid.addEventListener('loadedmetadata',()=>{
        dVid.currentTime=Math.min(local,Math.max(0,(dVid.duration||sg.dur)-.05));
      },{once:true});
      if(thenPlay){
        dVid.play().catch(()=>{});
        dVid.addEventListener('canplay',()=>{
          if(docm.classList.contains('on'))dVid.play().catch(()=>{});
        },{once:true});
      }
    } else if(dVid.readyState>=1){
      dVid.currentTime=Math.min(local,Math.max(0,(dVid.duration||sg.dur)-.05));
      if(thenPlay)dVid.play().catch(()=>{});
    }
    const c2=clips[sg.id]||{};
    $('docTitle').textContent='CHANNEL: '+docCtx.channel+' — #'+(c2.index||'?')
      +' '+((c2.title||'').slice(0,40));
  }
  dCode.addEventListener('scroll',()=>{
    // the film's own scroll lands exactly where it aimed; anything else is the reader
    if(Math.abs(dCode.scrollTop-dProgTop)<2)return;
    dUserT=performance.now();
    const max=dCode.scrollHeight-dCode.clientHeight;
    if(max<=0||!docCtx)return;
    const frac=clamp01(dCode.scrollTop/max);
    if(docCtx.segs){
      const li=frac*(docCtx.lines.length-1);
      const sg=docCtx.segs.find(s=>li>=s.startLine&&li<=s.endLine)
        ||docCtx.segs[docCtx.segs.length-1];
      const span=Math.max(1,sg.endLine-sg.startLine);
      chanSetVideo(sg,clamp01((li-sg.startLine)/span)*sg.dur,!dVid.paused);
      dMarkRead(frac);
    } else if(dVid.duration){
      dVid.currentTime=frac*dVid.duration;
      dMarkRead(frac);
    }
  },{passive:true});
  dVid.addEventListener('timeupdate',()=>{
    if(!docm.classList.contains('on')||!dVid.duration)return;
    if(performance.now()-dUserT<1000)return;   // the reader is driving
    let frac;
    if(docCtx&&docCtx.segs&&docSeg){
      const lf=clamp01(dVid.currentTime/dVid.duration);
      const li=docSeg.startLine+lf*Math.max(1,docSeg.endLine-docSeg.startLine);
      frac=clamp01(li/(docCtx.lines.length-1));
    } else frac=dVid.currentTime/dVid.duration;
    const max=dCode.scrollHeight-dCode.clientHeight;
    if(max>0){
      dProgTop=Math.round(frac*max);
      try{dCode.scrollTo({top:dProgTop,behavior:'instant'});}
      catch(e){dCode.scrollTop=dProgTop;}
    }
    dMarkRead(frac);
  });
  // a channel doc rolls to the next clip like a reel change
  dVid.addEventListener('ended',()=>{
    if(!(docCtx&&docCtx.segs&&docSeg))return;
    const i=docCtx.segs.indexOf(docSeg);
    chanSetVideo(docCtx.segs[(i+1)%docCtx.segs.length],0,true);
  });
  docOpenChannel=async function(l){
    const ids=laneIds(l).filter(id2=>!(l.mute||[]).includes(id2));
    if(!ids.length){flash('CHANNEL IS EMPTY',false);return;}
    await rawPrompt(ids[0]);   // ensures RAWP
    const lines=[],segs=[]; let t=0;
    ids.forEach((id2,n)=>{
      const c2=clips[id2]||{};
      const startLine=lines.length;
      lines.push('======== '+(n+1)+' / '+ids.length+' · #'+(c2.index||'?')+' · '
        +((c2.title||'').slice(0,58))+' · '+Math.round(dur(id2))+'s ========');
      String((RAWP&&RAWP[id2])||c2.prompt_excerpt||'').replace(/\r/g,'').split('\n')
        .forEach(x=>lines.push(x));
      lines.push('');
      segs.push({id:id2,startLine,endLine:lines.length-1,dur:dur(id2),tStart:t});
      t+=dur(id2);
    });
    docCtx={channel:l.name,id:ids[0],lines,segs,total:t,txt:lines.join('\n')};
    docSel=new Set(); docLast=0; docSeg=null;
    docm.classList.add('on');
    dVid.loop=false;
    renderDoc();
    dCode.scrollTop=0;
    chanSetVideo(segs[0],0,true);
    flash('READING '+l.name+' — '+ids.length+' CLIPS · '+fmts(t),false);
  };
}
// line-similarity engine across all 1,107 prompts
let LINEIX=null;
function tokset(s2){return new Set(String(s2).toLowerCase().replace(/[^a-z0-9 ]/g,' ')
  .split(/\s+/).filter(w=>w.length>2));}
async function buildLineIndex(){
  if(LINEIX)return LINEIX;
  LINEIX=[];
  for(const id in clips){
    const txt=await rawPrompt(id);
    txt.split('\n').forEach((ln,i)=>{
      const toks=tokset(ln);
      if(toks.size>=2)LINEIX.push({id,i,ln,toks});
    });
  }
  return LINEIX;
}
$('docSim').onclick=async()=>{
  if(!docCtx||!docSel.size){flash('CLICK A LINE FIRST, THEN FIND SIMILAR',false);return;}
  flash('INDEXING '+ (LINEIX?LINEIX.length:'ALL') +' LINES...',false);
  await buildLineIndex();
  const q=new Set();
  [...docSel].forEach(i=>{for(const w of tokset(docCtx.lines[i]))q.add(w);});
  if(!q.size){flash('SELECTED LINES HAVE NO SEARCHABLE WORDS',false);return;}
  const out=[];

function themeTokens(sg){
  const words=new Set();
  String(sg.songTitle||'').toLowerCase().split(/\W+/).forEach(w=>{if(w.length>3)words.add(w);});
  if(MILCACHE&&MILCACHE.milestones){
    const m=MILCACHE.milestones[(sg.slug||'').replace(/^\d+_/,'')]||{};
    String(m.one_line||'').toLowerCase().split(/\W+/).forEach(w=>{if(w.length>3)words.add(w);});
  }

function rollEra(eraTitle){
  const sg=SONGS[eraTitle]; if(!sg)return null;
  const pool=(facets.named_film[eraTitle]||[]).slice();
  // score = freshness + speech that rhymes with the song and the milestone
  const theme=themeTokens(sg);
  const affinity=id=>{
    const tx=(clips[id].transcript||'').toLowerCase();
    if(!tx)return 0;
    let hit=0; theme.forEach(w=>{if(tx.includes(w))hit++;});
    return Math.min(1.5,hit*0.5);
  };
  pool.sort((a,b)=>((USAGE[a]||0)-affinity(a)+Math.random())
                  -((USAGE[b]||0)-affinity(b)+Math.random()));
  const ids=[]; let t=0;
  for(const id of pool){
    if(t>=sg.dur)break;
    ids.push(id); t+=dur(id);
  }
  let k=1; while(S.pls[eraTitle+' CUT '+k])k++;
  const nm=eraTitle+' CUT '+k;
  const bs=BOOTS_BY_ERA[sg.n]||[];
  const opening=bs.length?[bs[Math.floor(Math.random()*bs.length)]]:[];
  S.pls[nm]={OPENING:opening,MIDDLE:ids,ENDING:[]};
  ids.forEach(id=>USAGE[id]=(USAGE[id]||0)+1);
  const li=S.lanes.findIndex(l=>l.name===eraTitle);
  S.lanes.splice(li>=0?li+1:S.lanes.length,0,{kind:'film',name:nm});
  return {nm,ids,t,target:sg.dur};
}

    for(let i=0;i<3;i++){if(rollEra(sg.eraTitle))n++;}
  } else if(mode==='random5'){
    const eras=Object.keys(SONGS);
    for(let i=0;i<5;i++){if(rollEra(eras[Math.floor(Math.random()*eras.length)]))n++;}
  }
  savePls();saveLanes();saveUsage();build();
  flash('AUTO: '+n+' NEW CUTS DEALT');
}
$('autoBtn').onclick=e=>{
  openCtx(e.clientX||300,e.clientY||60,[
    {t:'FILL: ONE CUT PER EMPTY ERA',f:()=>rollBatch('perEra')},
    {t:'DEAL: ONE PER ERA (ALL 14)',f:()=>rollBatch('allEras')},
    {t:'3 VARIANTS OF FOCUSED CHANNEL',f:()=>rollBatch('variants')},
    {t:'5 RANDOM SPINS (NO THEATRE)',f:()=>rollBatch('random5')},
    {t:(localStorage.getItem('monteAutoLaunch')==='1'?'DISABLE':'ENABLE')+' AUTO-FILL ON LAUNCH',
     f:()=>{const v=localStorage.getItem('monteAutoLaunch')==='1'?'0':'1';
       safeSet('monteAutoLaunch',v);
       flash('AUTO-FILL ON LAUNCH '+(v==='1'?'ON':'OFF'),false);}},
    {t:'CANCEL',dim:true}]);
};
// the launch rule: every era wakes up with at least one cut
if(localStorage.getItem('monteAutoLaunch')==='1'){
  let n=0;
  Object.keys(SONGS).forEach(t=>{
    const has=Object.keys(S.pls).some(nm=>nm.startsWith(t+' CUT'));
    if(!has&&rollEra(t))n++;
  });
  if(n){savePls();saveLanes();saveUsage();build();flash('AUTO-FILLED '+n+' ERAS',false);}
}
build();
})();
</script>
</body>
</html>
