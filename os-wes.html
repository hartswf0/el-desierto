<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORLD EYE SYSTEM 14.3</title>
<!--
  THE MACHINE, NOT THE MOVIE. The boots were decompiled (monte_decompile.py) into
  programs in the WORLD EYE SYSTEM 14.3 language. This is the INTERPRETER: it
  RUNS a program and both (a) generates the terminal text and (b) DRAWS the boot
  screen — deterministically, from code, not pixels. The source is EDITABLE:
  change it and the boot regenerates. Author new boots. Fix an imposter's chapter
  by editing one line. The loop is closed: source -> text -> picture.
-->
<style>
:root{--bg:#000;--phos:#33ff9a;--dim:#0f4a30;--dim2:#1c6b46;--amber:#ffd23f;--red:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--phos);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden;font-size:13px}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--dim);
  font-size:10px;letter-spacing:.16em}
#bar b{color:var(--phos)} #bar .sp{flex:1}
#bar input,#bar button{background:#021208;color:var(--phos);border:1px solid var(--dim2);
  font:inherit;font-size:11px;padding:5px 9px;letter-spacing:.06em;cursor:pointer}
#bar input{width:160px;cursor:text}
#bar button{text-transform:uppercase}
#bar button:hover{border-color:var(--phos)}
#main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--dim)}
#screenWrap{position:relative;flex:1 1 58%;min-height:0;background:#000;overflow:hidden}
#screen{position:absolute;inset:0;width:100%;height:100%}
#screenWrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55)),
    repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}
#term{flex:1 1 42%;overflow-y:auto;padding:12px 14px;line-height:1.5;white-space:pre-wrap;
  border-top:1px solid var(--dim);font-size:12px}
#term .hdr{color:#fff;text-shadow:0 0 8px var(--phos)}
#term .cmd{color:var(--amber)} #term .ok{color:var(--phos)}
#term .dim{color:var(--dim2)}
#side{width:min(40%,420px);display:flex;flex-direction:column;min-width:0}
#sideHd{font-size:9px;letter-spacing:.12em;color:var(--dim2);padding:8px 10px;border-bottom:1px solid var(--dim);
  display:flex;align-items:center;gap:8px}
#sideHd b{color:var(--phos)} #sideHd .sp{flex:1}
#src{flex:1;background:#010a05;color:var(--phos);border:0;outline:none;resize:none;
  font:inherit;font-size:12px;line-height:1.7;padding:10px 12px;letter-spacing:.02em}
#src::selection{background:rgba(51,255,154,.25)}
#sideFoot{font-size:9px;color:var(--dim2);padding:7px 10px;border-top:1px solid var(--dim);letter-spacing:.06em}
#sideFoot b{color:var(--amber)}
#foot{display:flex;gap:10px;padding:7px 12px;border-top:1px solid var(--dim);font-size:9px;
  letter-spacing:.1em;color:var(--dim2);align-items:center;overflow-x:auto;white-space:nowrap}
#foot b{color:var(--phos)}
#pick{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.95);display:none;overflow-y:auto;padding:14px}
#pick.on{display:block}
#pick .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
#pick .c{border:1px solid var(--dim2);cursor:pointer;background:#021208;padding:9px}
#pick .c b{color:var(--phos);font-size:10px;display:block} #pick .c span{font-size:8px;color:var(--dim2)}
#pick .c.imp{border-color:var(--red)} #pick .c.imp b{color:var(--red)}
#pick .c:hover{border-color:var(--phos)}
@media(max-width:760px){#main{flex-direction:column}#left{border-right:0}
  #side{width:auto;height:40%;border-top:1px solid var(--dim)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="bar"><b>WORLD EYE SYSTEM 14.3</b><span class="sp"></span>
    <input id="cmd" placeholder="RUN CHAPTER 3" autocomplete="off" spellcheck="false">
    <button id="runBtn">RUN</button>
    <button id="newBtn">NEW</button>
    <button id="pickBtn">PROGRAMS</button>
  </div>
  <div id="main">
    <div id="left">
      <div id="screenWrap"><canvas id="screen"></canvas></div>
      <div id="term"></div>
    </div>
    <div id="side">
      <div id="sideHd"><b>SOURCE</b><span class="sp"></span><span id="srcTag">— editable</span></div>
      <textarea id="src" spellcheck="false" autocomplete="off"></textarea>
      <div id="sideFoot">edit the source — it regenerates live · <b>RUN CHAPTER n</b> loads a decompiled boot</div>
    </div>
  </div>
  <div id="foot"><span id="stat">…</span></div>
</div>
<div id="pick"><div class="g" id="pickG"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const CV=$('screen'),CTX=CV.getContext('2d');
let WES=null,PROGS=[],TITLES={},IMP={};
try{TITLES=JSON.parse(localStorage.getItem('monteTitles')||'{}');}catch(e){}
const ERA=['','3D GOLDEN','TELESPHERE','SENSORAMA','ULTIMATE DISPLAY','DAMOCLES','PUBLIC GRID',
  'NASA VIEW','VPL','ARCADE ERA','VR WINTER','OCULUS','CONSUMER VR','OPEN STANDARD','VISION PRO'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

async function boot(){
  WES=await fetch('MONTE/WES/wes_programs.json').then(r=>r.json()).catch(()=>null);
  if(!WES){$('stat').textContent='no wes_programs.json — run monte_decompile.py --all';return;}
  // imposter map (optional): flag boots whose screen said another chapter
  try{const dirs=await Promise.all(Array.from({length:14},(_,i)=>
    fetch('MONTE/CHAPTER_DEEP/ch'+String(i+1).padStart(2,'0')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)));
    dirs.forEach(d=>d&&(d.imposters||[]).forEach(im=>{IMP[im.pid]=im.announced;}));}catch(e){}
  PROGS=Object.values(WES.programs).filter(p=>p.statements&&p.statements.length)
    .sort((a,b)=>(a.ran_chapter||99)-(b.ran_chapter||99));
  buildPicker();
  $('stat').innerHTML='<b>'+PROGS.length+'</b> programs · WORLD EYE SYSTEM 14.3 · the interpreter DRAWS the boot from code · '+Object.keys(IMP).length+' imposters flagged';
  const q=location.hash.length>1?PROGS.find(p=>p.pid===decodeURIComponent(location.hash.slice(1))):null;
  loadProgram(q||PROGS.find(p=>p.pid.includes('ch03_08'))||PROGS[0]);
}
function buildPicker(){
  const g=$('pickG');g.innerHTML='';
  PROGS.forEach(p=>{const d=document.createElement('div');const imp=IMP[p.pid];
    d.className='c'+(imp?' imp':'');
    d.innerHTML='<b>CH'+(p.ran_chapter||'·')+' · '+p.pid.replace(/^boot_/,'').slice(0,20)+'</b>'
      +'<span>'+p.statements.map(s=>s.op).join(' ')+(imp?' · ⚠ SCREEN SAYS CH'+imp:'')+'</span>';
    d.onclick=()=>{$('pick').classList.remove('on');loadProgram(p);};g.appendChild(d);});
}
$('pickBtn').onclick=()=>$('pick').classList.toggle('on');
$('runBtn').onclick=()=>runCmd($('cmd').value);
$('newBtn').onclick=()=>{ $('src').value=
  'C new program\nWORLD EYE SYSTEM 14.3\nRUN CHAPTER 1\nFOR k = 1..5: ADD MEASUREMENT POINT k\nEXPAND [] TO INCLUDE ALL POINTS\nRELATION UPDATED';
  $('srcTag').textContent='— authoring'; render(); };
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')runCmd($('cmd').value);});
let deb=null;
$('src').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,180);
  $('srcTag').textContent='— edited';});

// ---- source <-> program ----
function toSource(p){
  const L=['C '+p.pid, 'C decompiled · runs CHAPTER '+p.ran_chapter, 'WORLD EYE SYSTEM 14.3'];
  p.statements.forEach(s=>{if(s.op!=='HEADER')L.push(s.text);});
  return L.join('\n');
}
function parseWES(text){
  const stmts=[]; let chapter=null,m;
  text.split('\n').forEach(raw=>{
    const l=raw.trim(); if(!l||l[0]==='C')return;
    if(/WORLD EYE SYSTEM/i.test(l)){stmts.push({op:'HEADER',text:'WORLD EYE SYSTEM 14.3'});return;}
    if(m=l.match(/RUN\s+CHAPTER\s+0?(\d{1,2})/i)){chapter=+m[1];stmts.push({op:'RUN',text:'RUN CHAPTER '+(+m[1])});return;}
    if(m=l.match(/RUN\s+ACT\s+0?(\d)/i)){stmts.push({op:'RUN',text:'RUN ACT '+m[1]});return;}
    if(m=l.match(/FOR\s+\w+\s*=\s*(\d+)\s*\.\.\s*(\d+)/i)){stmts.push({op:'FOR',from:+m[1],to:+m[2],text:l});return;}
    if(m=l.match(/ADD\s+MEASUREMENT\s+POINT\s+(\d+)/i)){stmts.push({op:'ADD',point:+m[1],text:l});return;}
    if(/EXPAND/i.test(l)){stmts.push({op:'EXPAND',text:'EXPAND [] TO INCLUDE ALL POINTS'});return;}
    if(/RELATION\s+UPDATED/i.test(l)){stmts.push({op:'RELATION',text:'RELATION UPDATED'});return;}
    if(m=l.match(/DEFINE\s+(.+?)\s*=\s*(.+)/i)){stmts.push({op:'DEFINE',sym:m[1],val:m[2],text:l});return;}
    if(/^MOVE/i.test(l)){stmts.push({op:'MOVE',text:l});return;}
    if(/REPORT/i.test(l)){stmts.push({op:'REPORT',text:'SYSTEM REPORT'});return;}
    if(/^LOAD/i.test(l)){stmts.push({op:'LOAD',text:l});return;}
    stmts.push({op:'RAW',text:l});
  });
  return {pid:'edited',ran_chapter:chapter,statements:stmts};
}
function chTitle(n){return (TITLES[n]&&String(TITLES[n]).trim())||ERA[n]||('CHAPTER '+n);}

// ---- INTERPRET as text ----
function execute(p){
  const out=[['WORLD EYE SYSTEM 14.3','hdr'],['MEMORY OK · DISPLAY OK · EYE ONLINE','dim'],['','']];
  for(const s of p.statements){
    if(s.op==='HEADER')continue;
    if(s.op==='RUN'){out.push(['> '+s.text,'cmd']);const m=s.text.match(/CHAPTER\s+(\d+)/);
      out.push(['  LOADING '+(m?('CHAPTER '+m[1]+' — '+chTitle(+m[1])):s.text.replace('RUN ',''))+' ...','dim']);}
    else if(s.op==='FOR'){out.push(['> FOR k = '+s.from+'..'+s.to,'cmd']);
      for(let k=s.from;k<=s.to;k++)out.push(['    ADD MEASUREMENT POINT '+k+'   [ok]','ok']);}
    else if(s.op==='DEFINE')out.push(['> '+s.text,'cmd']);
    else if(s.op==='MOVE')out.push(['> '+(s.text.trim()||'MOVE FIELD'),'cmd']);
    else if(s.op==='EXPAND')out.push(['  '+s.text,'ok']);
    else if(s.op==='RELATION')out.push(['  '+s.text+'   ✓','ok']);
    else if(s.op==='REPORT')out.push(['','',],['———  SYSTEM REPORT  ———','dim']);
    else if(s.op==='LOAD')out.push(['> '+s.text,'cmd']);
    else out.push(['  '+s.text,'']);
  }
  out.push(['',''],['CHAPTER '+(p.ran_chapter!=null?p.ran_chapter:'?')+' READY.','hdr']);
  return out;
}

// ---- INTERPRET as picture: the program DRAWS the boot screen ----
function convexHull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(P.length<3)return P;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  const up=[];for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();return lo.concat(up);}
function renderBoot(prog){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=CV.clientWidth||640,h=CV.clientHeight||360;
  CV.width=w*dpr;CV.height=h*dpr;CTX.setTransform(dpr,0,0,dpr,0,0);
  CTX.fillStyle='#000';CTX.fillRect(0,0,w,h);
  CTX.strokeStyle='rgba(51,255,154,0.07)';CTX.lineWidth=1;
  for(let x=0;x<w;x+=26){CTX.beginPath();CTX.moveTo(x,0);CTX.lineTo(x,h);CTX.stroke();}
  for(let y=0;y<h;y+=26){CTX.beginPath();CTX.moveTo(0,y);CTX.lineTo(w,y);CTX.stroke();}
  const n=prog.ran_chapter||1, rng=mb32(hash('WES'+n+'.14.3'));
  let npts=0,syms=[],expand=false,relate=false,move=false;
  prog.statements.forEach(s=>{ if(s.op==='FOR')npts=Math.max(npts,s.to);
    if(s.op==='ADD')npts=Math.max(npts,s.point||1); if(s.op==='DEFINE')syms.push(s);
    if(s.op==='EXPAND')expand=true; if(s.op==='RELATION')relate=true; if(s.op==='MOVE')move=true; });
  if(!npts&&!syms.length)npts=3;
  const pad=Math.min(70,w*0.13), pts=[];
  for(let k=1;k<=Math.min(npts,24);k++)pts.push([pad+rng()*(w-2*pad),pad+34+rng()*(h-2*pad-50),k]);
  if(relate){CTX.strokeStyle='rgba(51,255,154,0.22)';CTX.lineWidth=1;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      CTX.beginPath();CTX.moveTo(pts[i][0],pts[i][1]);CTX.lineTo(pts[j][0],pts[j][1]);CTX.stroke();}}
  if(expand&&pts.length>=2){const H2=convexHull(pts.map(p=>[p[0],p[1]]));
    CTX.strokeStyle='rgba(255,210,63,0.75)';CTX.lineWidth=1.5;CTX.setLineDash([5,4]);
    CTX.beginPath();H2.forEach((q,i)=>i?CTX.lineTo(q[0],q[1]):CTX.moveTo(q[0],q[1]));CTX.closePath();CTX.stroke();CTX.setLineDash([]);}
  pts.forEach(([x,y,k])=>{CTX.strokeStyle='#33ff9a';CTX.lineWidth=1.2;CTX.shadowColor='#33ff9a';CTX.shadowBlur=6;
    CTX.beginPath();CTX.moveTo(x-5,y);CTX.lineTo(x+5,y);CTX.moveTo(x,y-5);CTX.lineTo(x,y+5);CTX.stroke();CTX.shadowBlur=0;
    CTX.fillStyle='rgba(51,255,154,.8)';CTX.font='9px monospace';CTX.fillText(String(k),x+6,y-5);});
  syms.forEach((s,i)=>{const x=54+i*90,y=h-30;CTX.strokeStyle='#ffd23f';CTX.lineWidth=1.4;
    if(/\bO\b|CIRCLE|AUDIENCE/i.test(s.val||'')){CTX.beginPath();CTX.arc(x+7,y+7,7,0,6.28);CTX.stroke();}
    else CTX.strokeRect(x,y,14,14);
    CTX.fillStyle='#ffd23f';CTX.font='9px monospace';CTX.fillText(String(s.val||'').slice(0,16),x+20,y+11);});
  // header text
  CTX.fillStyle='#fff';CTX.font='bold 13px monospace';CTX.shadowColor='#33ff9a';CTX.shadowBlur=8;
  CTX.fillText('WORLD EYE SYSTEM 14.3',14,22);CTX.shadowBlur=0;
  CTX.fillStyle='#33ff9a';CTX.font='11px monospace';
  CTX.fillText('RUN CHAPTER '+n+'  ·  '+chTitle(n),14,40);
  CTX.fillStyle='rgba(51,255,154,.55)';CTX.font='10px monospace';
  CTX.fillText((npts?('MEASUREMENT POINTS: '+npts+(expand?' · BOUNDED':'')):'')+(relate?' · RELATED':''),14,h-14);
  const imp=IMP['boot_ch'+String(n).padStart(2,'0')];
}

// ---- run ----
function render(){
  const prog=parseWES($('src').value);
  renderBoot(prog);
  const term=$('term');term.innerHTML='';
  execute(prog).forEach(([t,c])=>{const s=document.createElement('span');s.className=c;s.textContent=t;
    term.appendChild(s);term.appendChild(document.createTextNode('\n'));});
  const cur=document.createElement('span');cur.textContent='█';cur.style.color='#33ff9a';term.appendChild(cur);
}
function loadProgram(p){
  $('src').value=toSource(p);$('srcTag').textContent=(IMP[p.pid]?'— ⚠ SCREEN SAYS CH'+IMP[p.pid]:'— decompiled');
  $('cmd').value='RUN CHAPTER '+(p.ran_chapter||'');
  render();
}
function runCmd(raw){
  const m=raw.toUpperCase().match(/RUN\s+CHAPTER\s+0?(\d{1,2})/);
  if(m){const n=+m[1];const p=PROGS.find(x=>x.ran_chapter===n);
    if(p)return loadProgram(p);
    $('src').value='C synthesized (no decompiled boot for chapter '+n+')\nWORLD EYE SYSTEM 14.3\nRUN CHAPTER '+n
      +'\nFOR k = 1..4: ADD MEASUREMENT POINT k\nEXPAND [] TO INCLUDE ALL POINTS\nRELATION UPDATED';
    $('srcTag').textContent='— synthesized';return render();}
  $('stat').innerHTML='<span style="color:var(--red)">SYNTAX: RUN CHAPTER n</span> · n = 1..14';
}
window.addEventListener('resize',()=>{try{renderBoot(parseWES($('src').value));}catch(e){}},{passive:true});
boot();
</script>
</body>
</html>
