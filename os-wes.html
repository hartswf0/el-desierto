<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORLD EYE SYSTEM 14.3</title>
<!--
  THE MACHINE, NOT THE MOVIE. The boots were decompiled (monte_decompile.py) into
  programs in the WORLD EYE SYSTEM 14.3 language. This is the INTERPRETER: it
  executes a program and GENERATES the terminal text deterministically — typed,
  live, real characters — instead of replaying pixels. RUN CHAPTER n executes the
  grammar; you can also write new programs. The OS became re-runnable code.
-->
<style>
:root{--bg:#000;--phos:#33ff9a;--dim:#0f4a30;--amber:#ffd23f;--red:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--phos);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden;font-size:14px}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--dim);
  font-size:10px;letter-spacing:.16em}
#bar b{color:var(--phos)} #bar .sp{flex:1}
#bar input,#bar select,#bar button{background:#021208;color:var(--phos);border:1px solid var(--dim);
  font:inherit;font-size:11px;padding:5px 9px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#bar input{width:150px;text-transform:none;cursor:text}
#bar button:hover,#bar select:hover{border-color:var(--phos)}
#main{flex:1;display:flex;min-height:0}
#term{flex:1;position:relative;overflow:hidden;padding:16px 18px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word}
#term .hdr{color:#fff;text-shadow:0 0 8px var(--phos)}
#term .cmd{color:var(--amber)} #term .ok{color:var(--phos)}
#term .dim{color:var(--dim)} #term .err{color:var(--red)}
#term .cur{display:inline-block;width:9px;height:15px;background:var(--phos);
  vertical-align:-2px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--phos)}
@keyframes blink{50%{opacity:0}}
#term::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5)),
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#side{width:min(38%,380px);border-left:1px solid var(--dim);display:flex;flex-direction:column;min-width:0}
#sideHd{font-size:9px;letter-spacing:.14em;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--dim)}
#src{flex:1;overflow-y:auto;padding:8px 10px;font-size:11px;line-height:1.7;white-space:pre-wrap}
#src .ln{color:var(--phos);cursor:default} #src .c{color:var(--dim)}
#src .run{color:var(--amber)} #src .now{background:rgba(51,255,154,.16);color:#fff}
#foot{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--dim);font-size:9px;
  letter-spacing:.1em;color:var(--dim);align-items:center;overflow-x:auto;white-space:nowrap}
#foot b{color:var(--phos)}
#pick{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.95);display:none;overflow-y:auto;padding:14px}
#pick.on{display:block}
#pick .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#pick .c{border:1px solid var(--dim);cursor:pointer;background:#021208;padding:9px}
#pick .c b{color:var(--phos);font-size:10px;display:block} #pick .c span{font-size:8px;color:var(--dim)}
#pick .c:hover{border-color:var(--phos)}
@media(max-width:720px){#main{flex-direction:column}#side{width:auto;height:36%;border-left:0;border-top:1px solid var(--dim)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="bar"><b>WORLD EYE SYSTEM 14.3</b><span class="sp"></span>
    <input id="cmd" placeholder="RUN CHAPTER 3" autocomplete="off" spellcheck="false">
    <button id="runBtn">RUN</button>
    <button id="pickBtn">PROGRAMS</button>
  </div>
  <div id="main">
    <div id="term"></div>
    <div id="side"><div id="sideHd">SOURCE · WORLD EYE SYSTEM 14.3</div><div id="src"></div></div>
  </div>
  <div id="foot"><span id="stat">…</span></div>
</div>
<div id="pick"><div class="g" id="pickG"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let WES=null,PROGS=[],TITLES={};
try{TITLES=JSON.parse(localStorage.getItem('monteTitles')||'{}');}catch(e){}
const ERA=['','3D GOLDEN','TELESPHERE','SENSORAMA','ULTIMATE DISPLAY','DAMOCLES','PUBLIC GRID',
  'NASA VIEW','VPL','ARCADE ERA','VR WINTER','OCULUS','CONSUMER VR','OPEN STANDARD','VISION PRO'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

async function boot(){
  WES=await fetch('MONTE/WES/wes_programs.json').then(r=>r.json()).catch(()=>null);
  if(!WES){$('stat').textContent='no wes_programs.json — run monte_decompile.py --all';return;}
  PROGS=Object.values(WES.programs).filter(p=>p.statements&&p.statements.length)
    .sort((a,b)=>(a.ran_chapter||99)-(b.ran_chapter||99));
  buildPicker();
  $('stat').innerHTML='<b>'+PROGS.length+'</b> programs recovered · WORLD EYE SYSTEM 14.3 · a real interpreter over decompiled source';
  const q=location.hash.length>1?PROGS.find(p=>p.pid===decodeURIComponent(location.hash.slice(1))):null;
  runProgram(q||PROGS.find(p=>p.pid.includes('ch03_08'))||PROGS[0]);
}
function buildPicker(){
  const g=$('pickG');g.innerHTML='';
  PROGS.forEach(p=>{const d=document.createElement('div');d.className='c';
    d.innerHTML='<b>CH'+(p.ran_chapter||'·')+' · '+p.pid.replace(/^boot_/,'').slice(0,22)+'</b>'
      +'<span>'+p.statements.map(s=>s.op).join(' ')+'</span>';
    d.onclick=()=>{$('pick').classList.remove('on');runProgram(p);};g.appendChild(d);});
}
$('pickBtn').onclick=()=>$('pick').classList.toggle('on');
$('runBtn').onclick=()=>runCmd($('cmd').value);
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')runCmd($('cmd').value);});

// ---- the INTERPRETER: a WES program -> generated terminal lines ----
function chTitle(n){return (TITLES[n]&&String(TITLES[n]).trim())||ERA[n]||('CHAPTER '+n);}
function execute(p){
  const out=[];const n=p.ran_chapter;
  out.push(['WORLD EYE SYSTEM 14.3','hdr']);
  out.push(['MEMORY OK  ·  DISPLAY OK  ·  EYE ONLINE','dim']);
  out.push(['','']);
  for(const s of p.statements){
    if(s.op==='HEADER')continue;
    if(s.op==='RUN'){
      out.push(['> '+s.text,'cmd']);
      const m=s.text.match(/CHAPTER\s+(\d+)/);
      if(m)out.push(['  LOADING CHAPTER '+m[1]+' — '+chTitle(+m[1])+' ...','dim']);
      else out.push(['  '+s.text.replace('RUN ','LOADING ')+' ...','dim']);
    }
    else if(s.op==='FOR'){
      out.push(['> FOR k = '+s.from+'..'+s.to,'cmd']);
      for(let k=s.from;k<=s.to;k++)out.push(['    ADD MEASUREMENT POINT '+k+'   [ok]','ok']);
    }
    else if(s.op==='DEFINE')out.push(['> '+s.text,'cmd']);
    else if(s.op==='MOVE')out.push(['> '+(s.text.trim()||'MOVE FIELD'),'cmd']);
    else if(s.op==='EXPAND')out.push(['  '+s.text,'ok']);
    else if(s.op==='RELATION')out.push(['  '+s.text+'   ✓','ok']);
    else if(s.op==='REPORT'){out.push(['','']);out.push(['———  SYSTEM REPORT  ———','dim']);}
    else if(s.op==='LOAD')out.push(['> '+s.text,'cmd']);
    else out.push(['  '+s.text,'']);
  }
  out.push(['','']);
  out.push(['CHAPTER '+n+' READY.','hdr']);
  return out;
}

// ---- deterministic typewriter (renders execute() live) ----
let typing=null;
function runProgram(p){
  clearTimeout(typing);
  renderSource(p);
  $('cmd').value='RUN CHAPTER '+(p.ran_chapter||'');
  const lines=execute(p);
  const term=$('term');term.innerHTML='';
  let li=0,ci=0,cur=null;
  function step(){
    if(li>=lines.length){if(cur)cur.outerHTML='<span class="cur"></span>';return;}
    const [txt,cls]=lines[li];
    if(ci===0){cur=document.createElement('span');cur.className=cls;term.appendChild(cur);
      const caret=document.createElement('span');caret.className='cur';term.appendChild(caret);cur._caret=caret;}
    if(ci<txt.length){cur.textContent=txt.slice(0,ci+1);
      cur.parentNode.appendChild(cur._caret);ci++;
      typing=setTimeout(step, txt[ci-1]===' '?6:14+Math.random()*10);
    }else{ if(cur._caret)cur._caret.remove();
      term.appendChild(document.createTextNode('\n'));li++;ci=0;
      typing=setTimeout(step, cls==='hdr'?260:txt===''?40:90); }
    term.scrollTop=term.scrollHeight;
  }
  step();
}
function renderSource(p){
  const box=$('src');
  const head=['C '+p.pid,'C decompiled from '+((p.filed_ch)?('ch'+String(p.filed_ch).padStart(2,'0')):'?')
    +' boot · runs CHAPTER '+p.ran_chapter,''];
  box.innerHTML=head.map(h=>'<div class="c">'+esc(h)+'</div>').join('')
    +p.statements.map(s=>'<div class="ln '+(s.op==='RUN'?'run':'')+'">'+esc(s.text)
      +(s.votes?'  <span class="c">x'+s.votes+'</span>':'')+'</div>').join('');
}
// RUN CHAPTER n from the command line: find that chapter's program (or synthesize)
function runCmd(raw){
  const m=raw.toUpperCase().match(/RUN\s+CHAPTER\s+0?(\d{1,2})/);
  if(m){const n=+m[1];const p=PROGS.find(x=>x.ran_chapter===n);
    if(p)return runProgram(p);
    // no decompiled program for n → synthesize a minimal one
    return runProgram({pid:'synth_ch'+n,ran_chapter:n,filed_ch:n,
      statements:[{op:'RUN',text:'RUN CHAPTER '+n,votes:0},
                  {op:'RELATION',text:'RELATION UPDATED',votes:0}]});
  }
  $('stat').innerHTML='<span style="color:var(--red)">SYNTAX: RUN CHAPTER n</span> · n = 1..14';
}
boot();
</script>
</body>
</html>
